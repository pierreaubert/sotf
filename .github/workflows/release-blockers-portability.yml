name: Release blocker portability

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-blockers-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-tests:
    name: Plugins / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            features: --features onnx,hal,qa
          - name: Linux
            os: ubuntu-24.04
            features: --features onnx,qa
          - name: Windows
            os: windows-2025
            features: --features onnx,qa

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-plugins-${{ runner.os }}

      - name: Run plugin unit, reference, preset, layout, and allocation tests
        run: cargo test -p sotf-plugins --lib --tests ${{ matrix.features }}

      - name: Check plugin warnings
        run: cargo clippy -p sotf-plugins --all-targets ${{ matrix.features }} -- -D warnings

  gpui-tests:
    name: GPUI / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Linux GPUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-gpui-${{ runner.os }}

      - name: Check GPUI targets
        run: cargo check -p sotf-gpui --all-targets

      - name: Run GPUI component, i18n, keybinding, and workflow tests
        run: cargo test -p sotf-gpui --lib --tests

      - name: Check GPUI design-token drift
        run: python scripts/check-design-tokens.py

      - name: Check GPUI warnings
        run: cargo clippy -p sotf-gpui --all-targets -- -D warnings
