name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build but don't create release)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------
  # macOS ARM64 runner — builds macOS ARM64 + macOS x86_64
  # -------------------------------------------------------------------
  macos:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build macOS ARM64
        run: just cross-macos-arm64

      - name: Build macOS x86_64
        run: just cross-macos-x86

      - name: Build AU plugins
        run: |
          just sync-au-versions
          just build-au-all

      - name: Sign macOS artifacts
        if: env.DEVELOPER_ID != ''
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
        run: ./scripts/sign-macos.sh

      - name: Notarize macOS artifacts
        if: env.DEVELOPER_ID != '' && env.APPLE_ID != ''
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: ./scripts/sign-macos.sh --notarize

      - name: Sign and notarize AU plugins
        if: env.DEVELOPER_ID != '' && env.APPLE_ID != ''
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          just install-au-all
          just sign-au-notarize

      - name: Package AU plugins
        run: just dist-au

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/sotf-desktop-*-macos-arm64.dmg
            dist/sotf-desktop-*-macos-x86_64.dmg
            dist/sotf-desktop-*-macos-arm64
            dist/sotf-desktop-*-macos-x86_64
            dist/sotf-tui-*-macos-arm64
            dist/sotf-tui-*-macos-x86_64
            dist/sotf-systemwide-*-macos-universal.pkg
            dist/au/sotf-audio-units-*.pkg
          retention-days: 7

  # -------------------------------------------------------------------
  # Linux x86_64 runner — builds Linux x86_64 (native) + Linux ARM64 (Docker)
  # -------------------------------------------------------------------
  linux:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc g++ pkg-config cmake ninja-build \
            libssl-dev ca-certificates patchelf \
            libglib2.0-dev libxkbcommon-x11-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libclang-dev \
            imagemagick fakeroot

      - name: Install just
        run: |
          command -v just || cargo install just
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux x86_64 (native)
        run: ./scripts/build-linux.sh --appimage

      - name: Build Linux ARM64 (Docker)
        run: just docker-linux-arm64
        continue-on-error: true

      - name: Sign Linux artifacts
        if: always()
        run: |
          if command -v cosign &> /dev/null; then
            ./scripts/sign-linux.sh --key "${{ secrets.COSIGN_KEY_PATH }}"
          else
            echo "cosign not installed, skipping Linux signing"
          fi
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/sotf-desktop-*-linux-*.tar.gz
            dist/sotf-desktop-*-linux-arm64.AppImage
            dist/sotf-desktop-*-linux-x86_64.AppImage
            dist/sotf-desktop_*_*.deb
            dist/*.bundle
          retention-days: 7

  # -------------------------------------------------------------------
  # Windows x86_64 runner — builds Windows x86_64 (native MSVC)
  # -------------------------------------------------------------------
  windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        shell: bash
        run: |
          command -v just || cargo install just
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows x86_64
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cargo build --release -p sotf-tui --bin sotf-tui
          cp target/release/sotf-tui.exe "dist/sotf-tui-${VERSION}-windows-x86_64.exe"

      - name: Sign Windows executables
        if: env.WINDOWS_CERT_THUMBPRINT != ''
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        shell: pwsh
        run: |
          .\scripts\sign-windows.ps1 -CertificateThumbprint "$env:WINDOWS_CERT_THUMBPRINT"

      - name: Build MSIX package
        shell: pwsh
        # Native PowerShell — uses MakeAppx.exe directly. No Git Bash, no
        # MSYS path conversion, no third-party zip dependency.
        run: .\scripts\build-msix.ps1 -Arch x86_64 -Sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/sotf-tui-*-windows-x86_64.exe
            dist/sotf-desktop-*-windows-x86_64.msix
          retention-days: 7

  # -------------------------------------------------------------------
  # Create GitHub Release (runs after all builds complete)
  # -------------------------------------------------------------------
  release:
    needs: [macos, linux, windows]
    runs-on: [self-hosted, Linux, X64]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "SotF v${VERSION}" \
            --generate-notes \
            dist/*
