name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  AUTOEQ_DIR: $GITHUB_WORKSPACE
  JUST_JUSTFILE: $GITHUB_WORKSPACE/Justfile

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ pkg-config libssl-dev ca-certificates

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        run: |
          cargo install just
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install for Linux
        run: |
          sudo AUTOEQ_DIR="$GITHUB_WORKSPACE" just install-linux-root
          sudo AUTOEQ_DIR="$GITHUB_WORKSPACE" just install-ubuntu-common
          sudo AUTOEQ_DIR="$GITHUB_WORKSPACE" just install-ubuntu-x86
          just post-install-npm

      - name: Check design-token drift (app-gpui)
        run: python3 scripts/check-design-tokens.py

      - name: Build
        run: just build

      - name: Run tests
        run: just test

      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov

      - name: Generate coverage report
        run: just coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov.info
          path: target/lcov.info
          if-no-files-found: error

      - name: Build UI kit examples
        run: just test-examples

      - name: QA for AutoEQ
        run: just qa
