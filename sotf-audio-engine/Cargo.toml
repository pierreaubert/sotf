[package]
name = "sotf-audio-engine"
description = "an audio player and recorder that support audio plugins"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "sotf_audio"
path = "src/lib.rs"

[features]
default = []
hal = ["sotf-hal", "sotf-audio-plugins/hal"]

[[bin]]
name = "sotf-player-cli"
path = "bin/sotf_player_cli.rs"

[[bin]]
name = "sotf-recorder-cli"
path = "bin/sotf_recorder_cli.rs"

[[bin]]
name = "generate-audio-tests"
path = "bin/generate_audio_tests.rs"

[[bin]]
name = "wav2csv"
path = "bin/wav2csv.rs"

[[bin]]
name = "sotf-daemon"
path = "bin/sotf_daemon.rs"
required-features = ["hal"]

[dependencies]
tokio = { workspace = true }
ndarray = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
walkdir = { workspace = true }
autoeq-env = { workspace = true }
math-iir-fir = { workspace = true }
sotf-audio-plugins = { path = "../sotf-audio-plugins", default-features = false }
num-complex = { workspace = true, features = ["serde"] }

# TUI framework
ratatui = { workspace = true }
crossterm = { workspace = true }

# Audio decoding/encoding
symphonia = { workspace = true, default-features = false }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-codec-alac = { workspace = true }
symphonia-codec-pcm = { workspace = true }
symphonia-codec-vorbis = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
ebur128 = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
id3 = { workspace = true }
metaflac = { workspace = true }
rtrb = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
sotf-hal = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

