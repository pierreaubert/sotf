[workspace]
members = [
    "src-audio",
    "src-audio-player",
    "src-autoeq",
    "src-bem",
    "src-cea2034",
    "src-convexhull3d",
    "src-de",
    "src-env",
    "src-gpui-player",
    "src-hal",
    "src-head-scanner",
    "src-iir",
    "src-tauri",
    "src-testfunctions",
]
# Default members excludes
#   - macOS-only src-hal, src-configbar
#   - src-bem
#   - src-head-scanner
#   - src-gpui-player
#
# On macOS, you can still build it explicitly with:
#            just prod-hal
#            just prod-configbar
#
# Crate head-scanner is build separetly since it is hard to get all the dependency right
# src-gpui-player is also excluded from default build due to heavy GPUI dependency
#
default-members = [
    "src-audio",
    "src-audio-player",
    "src-autoeq",
    "src-cea2034",
    "src-convexhull3d",
    "src-de",
    "src-env",
    "src-iir",
    "src-tauri",
    "src-testfunctions",
]
resolver = "3"

[workspace.package]
version = "0.5.1"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "Optimise the sound of your speakers or your headphones"
edition = "2024"
documentation = "https://docs.rs/sotf"
license = "GPL-3.0-or-later"
repository = "https://github.com/pierreaubert/sotf"

[workspace.dependencies]

# Serialization and data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.4"
regex = "1.12"

# Async and networking
# ideally we would use only threads or only tokio
anyhow = { version = "1.0" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
reqwest = { version = "0.12.24", features = ["json"] }
urlencoding = "2.1"
futures = "0.3"
futures-util = "0.3"
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }

# CLI and system
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
num_cpus = "1.17"
thiserror = "2.0.17"
strsim = "0.11"
chrono = "0.4"
tempfile = "3.23"
base64 = "0.22"
byteorder = "1.5"
libc = "0.2"
log = "0.4"
env = "1"
env_logger = "0.11"
which = "8"

# Optimization and math
ndarray = { version = "0.17", features = ["rayon", "blas", "serde"] }
ndarray-linalg = { version = "0.18" }
rand = "0.9.2"
num-complex = "0.4"
num-traits = "0.2"
netcdf = "0.11"
hdf5 = { package = "hdf5-metno", version = "0.10.0" }
metaheuristics-nature = "10.1"
rayon = "1.11"
nlopt = "0.8.1"
blas-src = {version="0.14"}
rustfft = "6.4"
special = "0.11"  # Bessel, Hankel, Legendre functions
spec_math = "0.1.6"
autoeq = { path = "src-autoeq" }

# Plotting and visualization
plotly = { version = "0.13.5" }
# plotly_static will be specified per-crate as needed
# patched currently locally
webdriver-downloader = "0.16.0"
build_html = "2.7.0"

# audio
cpal = "0.16.0"
ebur128 = "0.1.10"
hound = "3.5"
id3 = "1.16"
metaflac = "0.2"
rubato = "0.16.2"
symphonia = { version = "0.5", default-features = false }
symphonia-core = "0.5"
symphonia-metadata = "0.5"
symphonia-bundle-flac = "0.5"
symphonia-bundle-mp3 = "0.5"
symphonia-codec-aac = "0.5"
symphonia-codec-pcm = "0.5"
symphonia-codec-vorbis = "0.5"
symphonia-format-riff = "0.5"
symphonia-format-ogg = "0.5"
symphonia-format-isomp4 = "0.5"

# tauri
tauri = { version="2.9", features = [] }
tauri-plugin-dialog = { version="2.4" }
tauri-plugin-fs = "2"
tauri-plugin-devtools = "2.0.1"

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

[patch.crates-io]
webdriver-downloader = { version = "0.16.4", git = "https://github.com/pierreaubert/webdriver-downloader" }

[profile.dev]
# NOTE: Aggressive optimization settings (opt-level="z", lto=true, strip=true)
# in debug mode cause segfaults in cpal/CoreAudio device enumeration on macOS.
# Using standard debug settings instead.
opt-level = 0
panic = "unwind"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
