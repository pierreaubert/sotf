[workspace]
members = [
    "src-autoeq",
    "src-iir",
    "src-de",
    "src-cea2034",
    "src-testfunctions",
    "src-env",
    "src-audio",
    "src-tauri",
    "src-hal",
    "src-ui-player"
    "src-head-scanner"
    "src-convexhull3d"
]
resolver = "3"

[workspace.package]
version = "0.4.466"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "A CLI for automatically eq-eing your speakers or your headphones"
edition = "2024"
documentation = "https://docs.rs/autoeq"
license = "GPL-3.0-or-later"
repository = "https://github.com/pierreaubert/autoeq"

[workspace.dependencies]
# Core numerical computing
ndarray = { version = "0.16.1", features = ["rayon", "blas", "serde"] }

# Serialization and data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.4"
regex = "1.12"

# Async and networking
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
reqwest = { version = "0.12.24", features = ["json"] }
urlencoding = "2.1"
futures = "0.3"
futures-util = "0.3"

# CLI and system
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
num_cpus = "1.17"
thiserror = "2.0.17"
strsim = "0.11"
chrono = "0.4"
tempfile = "3.23"
which = "6.0"
base64 = "0.22"
byteorder = "1.5"
libc = "0.2"
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }

# Optimization and math
rand = "0.9.2"
num-complex = "0.4"
metaheuristics-nature = "10.1"
rayon = "1.11"
nlopt = "0.8.1"
blas-src = {version="0.14"}
rustfft = "6.2"
autoeq = { path = "src-autoeq" }

# Plotting and visualization
plotly = { version = "0.13.5" }
# plotly_static will be specified per-crate as needed
# patched currently locally
webdriver-downloader = "0.16.0"
build_html = "2.7.0"

# audio
cpal = "0.16.0"
symphonia = { version = "0.5", default-features = false }
symphonia-core = "0.5"
symphonia-metadata = "0.5"
symphonia-bundle-flac = "0.5"
symphonia-bundle-mp3 = "0.5"
symphonia-codec-aac = "0.5"
symphonia-codec-pcm = "0.5"
symphonia-codec-vorbis = "0.5"
symphonia-format-riff = "0.5"
symphonia-format-ogg = "0.5"
symphonia-format-isomp4 = "0.5"
ebur128 = "0.1.10"
hound = "3.5"
rubato = "0.16.2"

# tauri
tauri = { version="2.9", features = [] }
tauri-plugin-dialog = { version="2.4" }
tauri-plugin-fs = "2"
tauri-plugin-devtools = "2.0.1"

[patch.crates-io]
webdriver-downloader = { version = "0.16.4", git = "https://github.com/pierreaubert/webdriver-downloader" }

[profile.dev]
# NOTE: Aggressive optimization settings (opt-level="z", lto=true, strip=true)
# in debug mode cause segfaults in cpal/CoreAudio device enumeration on macOS.
# Using standard debug settings instead.
opt-level = 0
panic = "unwind"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
