resolver = "3"

[workspace.package]
version = "0.5.14"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "Optimise the sound of your speakers or your headphones"
edition = "2024"
documentation = "https://docs.rs/sotf"
license = "GPL-3.0-or-later"
repository = "https://github.com/pierreaubert/sotf"

[workspace.dependencies]

# Serialization and data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.2"
build_html = "2.7"

# Async and networking
# ideally we would use only threads or only tokio
anyhow = { version = "1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
# tokio-tungstenite = "0.21"
signal-hook = "0.4"
reqwest = { version = "0.13", features = ["json"] }
urlencoding = "2.1"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }

# CLI and system
base64 = "0.22"
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
console_error_panic_hook = { version = "0.1" }
csv = "1.4"
ctrlc = "3.5"
directories = "6"
# env = "1"
env_logger = "0.11"
# getrandom = "0.2"
libc = "0.2"
log = "0.4"
mimalloc = { version = "0.1" }
notify = { version = "8.2" }
num_cpus = "1.17"
regex = "1.12"
rfd = "0.16"
rusqlite = { version = "0.38", features = ["bundled"] }
rust-embed = "8"
smol = "2.0"
strsim = "0.11"
tempfile = "3.23"
thiserror = "2.0.17"
criterion = "0.8.1"
which = "8"
walkdir = "2"
qrcode = "0.14"

# Optimization and math
ndarray = { version = "0.17", default-features = false, features = ["rayon", "serde"] }
oxiblas-ndarray = { version = "0.2.1" }
rand = "0.9.2"
sofa-reader = { path = "crates/3rdparties/sofa-reader" }
num-complex = "0.4"
num-traits = "0.2"
rayon = "1.11"
rustfft = "6.4"
realfft = "3.5"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
metaheuristics-nature = "10.1"
nlopt = "0.8"

# using crates version
math-test-functions = { path = "crates/math-audio/math-test-functions", version = "0.4", default-features = false }
math-solvers = { path = "crates/math-audio/math-solvers", version = "0.4", default-features = false }
math-wave = { path = "crates/math-audio/math-wave", version = "0.4" }
math-delaunay = { path = "crates/math-audio/math-delaunay", version = "0.4" }
math-xem-common = { path = "crates/math-audio/math-xem-common", version = "0.4" }
math-iir-fir = { path = "crates/math-audio/math-iir-fir", version = "0.4" }
math-optimisation = { path = "crates/math-audio/math-optimisation", version = "0.4" }
math-dsp = { path = "crates/math-audio/math-dsp", version = "0.4" }
math-bem = { path = "crates/math-audio/math-bem", version = "0.4", default-features = false, features = ["native"] }
math-fem = { path = "crates/math-audio/math-fem", version = "0.4", default-features = false, features = ["native"] }

autoeq-env = { version = "0.4", path = "crates/autoeq/autoeq-env" }
autoeq-cea2034 = { version = "0.4", path = "crates/autoeq/autoeq-cea2034" }
autoeq = { version = "0.4", path = "crates/autoeq/autoeq" }

# using git version
gpui-d3rs = { version = "0.6", path = "crates/gpui-toolkit/gpui-d3rs" }
gpui-px = { version = "0.6", path = "crates/gpui-toolkit/gpui-px" }
gpui-autoeq = { version = "0.6", path = "crates/gpui-toolkit/gpui-autoeq" }
gpui-ui-kit = { version = "0.6", path = "crates/gpui-toolkit/gpui-ui-kit" }
gpui-ui-kit-macros = { version = "0.6", path = "crates/gpui-toolkit/gpui-ui-kit-macros" }
gpui-ios = { version = "0.6", path = "crates/gpui-toolkit/gpui-ios" }

# SotF
sotf-host = { path = "crates/sotf-plugins/crates/sotf-host", default-features = false }
sotf-plugin-ab-compare = { path = "crates/sotf-plugins/crates/sotf-plugin-ab-compare" }
sotf-plugin-aec = { path = "crates/sotf-plugins/crates/sotf-plugin-aec" }
sotf-plugin-ambisonics = { path = "crates/sotf-plugins/crates/sotf-plugin-ambisonics" }
sotf-plugin-band-merge = { path = "crates/sotf-plugins/crates/sotf-plugin-band-merge" }
sotf-plugin-beamformer = { path = "crates/sotf-plugins/crates/sotf-plugin-beamformer" }
sotf-plugin-band-split = { path = "crates/sotf-plugins/crates/sotf-plugin-band-split" }
sotf-plugin-binaural = { path = "crates/sotf-plugins/crates/sotf-plugin-binaural" }
sotf-plugin-channel-mute-solo = { path = "crates/sotf-plugins/crates/sotf-plugin-channel-mute-solo" }
sotf-plugin-compressor = { path = "crates/sotf-plugins/crates/sotf-plugin-compressor" }
sotf-plugin-convolution = { path = "crates/sotf-plugins/crates/sotf-plugin-convolution" }
sotf-plugin-crossfeed = { path = "crates/sotf-plugins/crates/sotf-plugin-crossfeed" }
sotf-plugin-crossover = { path = "crates/sotf-plugins/crates/sotf-plugin-crossover" }
sotf-plugin-delay = { path = "crates/sotf-plugins/crates/sotf-plugin-delay" }
sotf-plugin-denoiser = { path = "crates/sotf-plugins/crates/sotf-plugin-denoiser" }
sotf-plugin-downmix = { path = "crates/sotf-plugins/crates/sotf-plugin-downmix" }
sotf-plugin-eq = { path = "crates/sotf-plugins/crates/sotf-plugin-eq" }
sotf-plugin-expander = { path = "crates/sotf-plugins/crates/sotf-plugin-expander" }
sotf-plugin-fletcher-munson = { path = "crates/sotf-plugins/crates/sotf-plugin-fletcher-munson" }
sotf-plugin-gain = { path = "crates/sotf-plugins/crates/sotf-plugin-gain" }
sotf-plugin-gate = { path = "crates/sotf-plugins/crates/sotf-plugin-gate" }
sotf-plugin-hal-input = { path = "crates/sotf-plugins/crates/sotf-plugin-hal-input" }
sotf-plugin-hal-output = { path = "crates/sotf-plugins/crates/sotf-plugin-hal-output" }
sotf-plugin-limiter = { path = "crates/sotf-plugins/crates/sotf-plugin-limiter" }
sotf-plugin-loudness-compensation = { path = "crates/sotf-plugins/crates/sotf-plugin-loudness-compensation" }
sotf-plugin-matrix = { path = "crates/sotf-plugins/crates/sotf-plugin-matrix" }
sotf-plugin-mono-to-stereo = { path = "crates/sotf-plugins/crates/sotf-plugin-mono-to-stereo" }
sotf-plugin-multiband-compressor = { path = "crates/sotf-plugins/crates/sotf-plugin-multiband-compressor" }
sotf-plugin-multiband-expander = { path = "crates/sotf-plugins/crates/sotf-plugin-multiband-expander" }
sotf-plugin-pnd = { path = "crates/sotf-plugins/crates/sotf-plugin-pnd" }
sotf-plugin-resampler = { path = "crates/sotf-plugins/crates/sotf-plugin-resampler" }
sotf-plugin-upmixer = { path = "crates/sotf-plugins/crates/sotf-plugin-upmixer", default-features = false }
sotf-plugin-xtc = { path = "crates/sotf-plugins/crates/sotf-plugin-xtc" }
sotf-iamf = { path = "crates/sotf-iamf" }
sotf-streaming = { path = "crates/sotf-streaming" }
sotf-mpd = { path = "crates/sotf-mpd" }
sotf-services = { path = "crates/sotf-services", default-features = false }
sotf-dlna = { path = "crates/sotf-dlna" }
sotf-cast = { path = "crates/sotf-cast" }
sotf-engine = { path = "crates/sotf-engine", default-features = false }
sotf-player = { path = "crates/sotf-player" }
sotf-midi = { path = "crates/sotf-midi" }
sotf-plugins = { path = "crates/sotf-plugins", default-features = false }
driver-common = { path = "crates/systemwide/crates/driver-common" }
driver-hal = { path = "crates/systemwide/crates/driver-hal" }  # macOS only

# audio
cpal = "0.17"
hound = "3.5"
id3 = "1.16"
metaflac = "0.2"
rubato = "1.0"
audioadapter-buffers = "2.0"
symphonia = { version = "0.5", default-features = false }
symphonia-core = "0.5"
symphonia-metadata = "0.5"
symphonia-bundle-flac = "0.5"
symphonia-bundle-mp3 = "0.5"
symphonia-codec-aac = "0.5"
symphonia-codec-alac = "0.5"
symphonia-codec-pcm = "0.5"
symphonia-codec-vorbis = "0.5"
symphonia-format-riff = "0.5"
symphonia-format-ogg = "0.5"
symphonia-format-isomp4 = "0.5"
rtrb = "0.3"
midir = "0.10"

# TUI framework
ratatui = "0.30"
ratatui-image = { version = "10", default-features = false, features = ["serde", "crossterm", "image-defaults"] }
crossterm = "0.29"

# GPUI framework - all packages must use the same git revision
gpui = { version="*", git = "https://github.com/zed-industries/zed.git", rev = "dd9efd9cbe73af15fae92d9d34137d253c16d12f" }
gpui-component = "0.5.0"
gpui_macos = { version="*", git = "https://github.com/zed-industries/zed.git", rev = "dd9efd9cbe73af15fae92d9d34137d253c16d12f", features = ["font-kit"] }
gpui_linux = { version="*", git = "https://github.com/zed-industries/zed.git", rev = "dd9efd9cbe73af15fae92d9d34137d253c16d12f" }
gpui_windows = { version="*", git = "https://github.com/zed-industries/zed.git", rev = "dd9efd9cbe73af15fae92d9d34137d253c16d12f" }

# System and low-level
block = "0.1"
objc = "0.2"
cocoa = "0.26"
dirs = "6"
# sysinfo = "0.37"
# memory-stats = "1.2"
crossbeam = "0.8"
arc-swap = "1"

# WASM support
wasm-bindgen = { version = "0.2" }
wasm-bindgen-rayon = { version = "1.2" }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Navigator",
    "Performance",
    "DomException",
] }

# Utilities
md-5 = "0.10"
toml = "0.8"
spec_math = "0.1"
approx = "0.5"
unicode-normalization = "0.1"
# toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1.4"
bincode = { version = "2.0.1", features = ["serde"] }

# Proc macro dependencies
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# Graphics and visualization
plotly = "0.13"
plotly_static = { version = "0.1", features = ["chromedriver", "webdriver_download"] }
wgpu = "28"
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.30"
pollster = "0.4"
image = "0.25"
fontdue = "0.9"
delaunator = "1.0"

# GPU and macOS graphics
metal = "0.33"
core-graphics = "0.25"
core-foundation = "0.10"
core-foundation-sys = "0"

# objc2 framework bindings (macOS)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-vision = "0.3"
objc2-core-image = "0.3"
objc2-core-video = "0.3"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
dispatch = "0.2"

# Media controls
souvlaki = "0.8"

# Camera capture
nokhwa = { version = "0.10", default-features = false }

# QR code decoding from camera
rqrr = "0.10.0"

# RNNoise (pure Rust)
nnnoiseless = "0.1"

# ONNX Runtime
ort = "2.0.0-rc.10"

# TUI extensions

# ffi
cbindgen = "0.29"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
string_to_string = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

[profile.dev]
opt-level = 1
split-debuginfo= "packed"
debug = 1
codegen-units = 256

# Fix: git font-kit rev has broken core-text imports; use local patched version
# that also adds tvOS/watchOS/visionOS to Apple platform cfg gates.
[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { path = "crates/3rdparties/zed-font-kit" }

# Patches for tvOS/watchOS/visionOS support (Tier 3 Apple platforms):
# - psm: assembly files use ELF directives instead of Mach-O on unrecognized Apple OSes
# - zed-font-kit: pulls in fontconfig/freetype instead of CoreText on tvOS
# - coreaudio-rs: cfg(target_os = "ios") doesn't include tvos
# - mach2: compile_error! gate doesn't include tvos
[patch.crates-io]
psm = { path = "crates/3rdparties/psm" }
zed-font-kit = { path = "crates/3rdparties/zed-font-kit" }
coreaudio-rs = { path = "crates/3rdparties/coreaudio-rs" }
mach2 = { path = "crates/3rdparties/mach2" }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"  # Changed from "abort" to allow tests to run
# debug = true # Keeps debug symbols for profiling
