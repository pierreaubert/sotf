[workspace]
members = [
    "crates/engine",
    "crates/player",
    "crates/midi",
    "crates/tools",
    "crates/app-cli",
    "crates/app-gpui",
    "crates/app-tui",
    "crates/plugins",
    "crates/plugins-ffi",
    "crates/plugins-gpui",
    "crates/driver-hal",
    "crates/head-tracker",
    "crates/daemon",
    "crates/math-audio/math-differential-evolution",
    "crates/math-audio/math-xem-common",
    "crates/math-audio/math-solvers",
    "crates/math-audio/math-iir-fir",
    "crates/math-audio/math-dsp",
    "crates/math-audio/math-bem",
    "crates/math-audio/math-fem",
    "crates/autoeq/autoeq-cea2034",
    "crates/autoeq/autoeq-roomsim",
    "crates/autoeq/autoeq-datagen",
    "crates/autoeq/autoeq",
]
resolver = "3"

[workspace.package]
version = "0.5.11"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "Optimise the sound of your speakers or your headphones"
edition = "2024"
documentation = "https://docs.rs/sotf"
license = "GPL-3.0-or-later"
repository = "https://github.com/pierreaubert/sotf"

[workspace.dependencies]

# Serialization and data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.2"
build_html = "2.7"

# Async and networking
# ideally we would use only threads or only tokio
anyhow = { version = "1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
# tokio-tungstenite = "0.21"
signal-hook = "0.4"
# signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
reqwest = { version = "0.13", features = ["json"] }
urlencoding = "2.1"
# futures = "0.3"
# futures-util = "0.3"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }

# CLI and system
base64 = "0.22"
byteorder = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
console_error_panic_hook = { version = "0.1" }
csv = "1.4"
ctrlc = "3.5"
directories = "6"
# env = "1"
env_logger = "0.11"
# getrandom = "0.2"
libc = "0.2"
log = "0.4"
mimalloc = { version = "0.1" }
notify = { version = "8.2" }
num_cpus = "1.17"
regex = "1.12"
rfd = "0.16"
rusqlite = { version = "0.38", features = ["bundled"] }
rust-embed = "8"
smol = "2.0"
strsim = "0.11"
tempfile = "3.23"
thiserror = "2.0.17"
criterion = "0.8.1"
which = "8"
walkdir = "2"

# Optimization and math
ndarray = { version = "0.17", default-features = false, features = ["rayon", "blas", "serde"] }
ndarray-linalg = { version = "0.18" }
rand = "0.9.2"
netcdf = "0.12" # for SOFA support
num-complex = "0.4"
num-traits = "0.2"
rayon = "1.11"
rustfft = "6.4"
realfft = "3.5"
metaheuristics-nature = "10.1"
nlopt = "0.8"

# using crates version
math-test-functions = { path = "crates/math-audio/math-test-functions", version = "0.3", default-features = false }
math-solvers = { path = "crates/math-audio/math-solvers", version = "0.3", default-features = false }
math-wave = { path = "crates/math-audio/math-wave", version = "0.3" }
math-xem-common = { path = "crates/math-audio/math-xem-common", version = "0.3" }
math-iir-fir = { path = "crates/math-audio/math-iir-fir", version = "0.3" }
math-convex-hull = { path = "crates/math-audio/math-convex-hull", version = "0.3" }
math-differential-evolution = { path = "crates/math-audio/math-differential-evolution", version = "0.3" }
math-dsp = { path = "crates/math-audio/math-dsp", version = "0.3" }
math-bem = { path = "crates/math-audio/math-bem", version = "0.3", default-features = false, features = ["native"] }
math-fem = { path = "crates/math-audio/math-fem", version = "0.3", default-features = false, features = ["native"] }

autoeq-env = { version = "0.3", path = "crates/autoeq/autoeq-env" }
autoeq-cea2034 = { version = "0.3", path = "crates/autoeq/autoeq-cea2034" }
autoeq = { version = ">=0.3.12", path = "crates/autoeq/autoeq" }
autoeq-roomsim = { version = "0.3", path = "crates/autoeq/autoeq-roomsim" }

# using git version
gpui-d3rs = { version = "0.6", path = "crates/gpui-toolkit/gpui-d3rs" }
gpui-px = { version = "0.6", path = "crates/gpui-toolkit/gpui-px" }
gpui-themes = { version = "0.6", path = "crates/gpui-toolkit/gpui-themes" }
gpui-ui-kit = { version = "0.6", path = "crates/gpui-toolkit/gpui-ui-kit" }
gpui-ui-kit-macros = { version = "0.6", path = "crates/gpui-toolkit/gpui-ui-kit-macros" }

engine = { path = "crates/engine", default-features = false }
midi = { path = "crates/midi" }
player = { path = "crates/player" }
plugins = { path = "crates/plugins", default-features = false }
driver-hal = { path = "crates/driver-hal" }  # macOS only
sotf-head-tracker = { path = "crates/head-tracker" }

# audio
# bliss-audio for music similarity analysis
# We use aubio-static to avoid runtime aubio dependency, and our own Symphonia decoder
# update-aubio-bindings uses bindgen to generate bindings (needed for macOS which has no prebuilt)
bliss-audio = { version = "0.11", default-features = false, features = ["aubio-static", "update-aubio-bindings"] }
cpal = "0.17"
ebur128 = "0.1.10"
hound = "3.5"
id3 = "1.16"
metaflac = "0.2"
rubato = "1.0"
audioadapter-buffers = "2.0"
symphonia = { version = "0.5", default-features = false }
symphonia-core = "0.5"
symphonia-metadata = "0.5"
symphonia-bundle-flac = "0.5"
symphonia-bundle-mp3 = "0.5"
symphonia-codec-aac = "0.5"
symphonia-codec-alac = "0.5"
symphonia-codec-pcm = "0.5"
symphonia-codec-vorbis = "0.5"
symphonia-format-riff = "0.5"
symphonia-format-ogg = "0.5"
symphonia-format-isomp4 = "0.5"
rtrb = "0.3"
rb = "0.4"
midir = "0.10"

# TUI framework
ratatui = "0.30"
ratatui-image = { version = "10", features = ["serde"] }
crossterm = "0.29"

# GPUI framework, using HEAD (macros with _)
gpui = { version="*", git = "https://github.com/zed-industries/zed.git" }
gpui_macros = { version="*", git = "https://github.com/zed-industries/zed.git" }

# System and low-level
objc = "0.2"
cocoa = "0.26"
dirs = "6"
# sysinfo = "0.37"
# memory-stats = "1.2"
crossbeam = "0.8"
arc-swap = "1"

# WASM support
wasm-bindgen = { version = "0.2" }
wasm-bindgen-rayon = { version = "1.2" }

# Utilities
toml = "0.8"
spec_math = "0.1"
approx = "0.5"
proptest = "1.9"
unicode-normalization = "0.1"
# toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1.4"
bincode = { version = "2.0.1", features = ["serde"] }

# Proc macro dependencies
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# Graphics and visualization
plotly = "0.13"
plotly_static = { version = "0.1", features = ["chromedriver", "webdriver_download"] }
wgpu = "25"
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.30"
pollster = "0.4"
image = "0.25"
fontdue = "0.9"
delaunator = "1.0"

# GPU and macOS graphics
metal = "0.33"
core-graphics = "0.25"
core-foundation = "0.10"
core-foundation-sys = "0"
coreaudio-sys = "0.2"

# objc2 framework bindings (macOS)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-vision = "0.3"
objc2-core-image = "0.3"
objc2-core-video = "0.3"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
dispatch = "0.2"

# Media controls
souvlaki = "0.8"

# Camera capture
nokhwa = { version = "0.10", default-features = false }

# ONNX Runtime
ort = "2.0.0-rc.10"

# TUI extensions

# ffi
cbindgen = "0.29"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
string_to_string = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

[profile.dev]
opt-level = 1
split-debuginfo= "packed"
debug = 1
codegen-units = 256

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"  # Changed from "abort" to allow tests to run

[patch.'https://github.com/zed-industries/font-kit']
zed-font-kit = { path = "crates/zed-font-kit" }
