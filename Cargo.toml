[workspace]
members = [
    "crates/sotf-dev-api",
    "crates/sotf-report-host",
    "crates/sotf-player",
    "crates/sotf-dev-driver",
    "crates/app-cli",
    "crates/app-gpui",
    "crates/app-tui",
    "crates/sotf-media-controls",
    "crates/sotf-server/crates/sotf-mpd",
    "crates/sotf-server/crates/sotf-services",
    "crates/sotf-server/crates/sotf-service-tidal",
    "crates/sotf-server/crates/sotf-service-spotify",
    "crates/sotf-server/crates/sotf-dlna",
    "crates/sotf-server/crates/sotf-cast",
    "crates/sotf-server/crates/sotf-federation",
    "crates/sotf-server/crates/sotf-tls",
    "crates/app-ios",
    "crates/app-tvos",
    "crates/sotf-docs-gen",
]
resolver = "3"

[workspace.package]
version = "0.7.19"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/pierreaubert/sotf"
keywords = ["audio", "dsp", "eq"]
categories = ["multimedia::audio"]
readme = "README.md"

[workspace.dependencies]
# Serialization and data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async and networking
# ideally we would use only threads or only tokio
anyhow = { version = "1.0" }
librespot-core = { package = "sotf-librespot-core",  version = "0.8", git = "https://github.com/pierreaubert/sotf-3rdparties", default-features = false, features = ["native-tls"] }
librespot-playback = { package = "sotf-librespot-playback",  version = "0.8", git = "https://github.com/pierreaubert/sotf-3rdparties", default-features = false, features = ["native-tls"] }
librespot-protocol = { package = "sotf-librespot-protocol",  version = "0.8", git = "https://github.com/pierreaubert/sotf-3rdparties", default-features = false }
# Exact pin (NOT caret): vergen 9.1.0 broke vergen-gitcl 1.0.8, used by
# librespot-core's build script — vergen 9.1's `Build` no longer implements
# vergen-lib 0.1's `Add` trait (E0277). A caret req would still allow 9.1+,
# so keep this exact until upstream vergen-gitcl supports vergen-lib 9.x.
# This dependency only pins the transitive version; nothing imports it.
vergen = { version = "=9.0.6" }
oauth2 = { version = "5", default-features = false }
rcgen = "0.14"
rustls = "0.23"
socket2 = "0.6"
tokio-rustls = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
# tokio-tungstenite = "0.21"
signal-hook = "0.4.5"
reqwest = { version = "0.13", features = ["json"] }
url = "2"
urlencoding = "2.1"
parking_lot = { version = "0.13.0", features = ["deadlock_detection"] }

# CLI and system
base64 = "0.23"
core-foundation-sys = "0.8"
dispatch2 = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
ctrlc = { version = "3.5", features = ["termination"] }
directories = "6"
env_logger = "0.11"
# Exact pin (NOT caret): libc 0.2.190 gated `_dyld_image_count` and the other
# `_dyld_get_image_*` functions to `target_os = "macos"`, but the `backtrace`
# crate compiles `symbolize/gimli/libs_macos.rs` for every
# `target_vendor = "apple"` target and calls those functions. The combination
# fails with E0425 on iOS/tvOS simulator and device targets (`backtrace` is
# pulled in via gpui -> scheduler). Hold at 0.2.191 until libc or `backtrace`
# ships a fix, then drop the `=` and `cargo update -p libc`.
libc = { version = "=0.2.191" }
log = "0.4.28"
mimalloc = { version = "0.1" }
notify = { version = "8.2" }
num_cpus = "1.17"
rfd = { version = "0.17.2", package = "sotf-rfd", git = "https://github.com/pierreaubert/sotf-3rdparties" }
# bundled SQLite is enabled per-app (app-gpui, app-tui, app-cli);
# library crates take the workspace dep bare so dev `cargo check -p <lib>`
# doesn't pay for the C compile. Feature unification re-enables `bundled`
# automatically when a shipping app is in the build graph.
rusqlite = { version = "0.41.1" }
rust-embed = "8"
smol = "2"
strsim = "0.11"
tempfile = "3.23"
thiserror = "2.0.17"
criterion = "0.8.2"
insta = { version = "1.42", features = ["json"] }
which = "8"
walkdir = "2"
qrcode = "0.14"

# Optimization and math
ndarray = { version = "0.17", default-features = false, features = ["rayon", "serde"] }
rand = "0.10.2"
num-complex = "0.4"
rustfft = "6.4"
realfft = "3.5"

# Shared numerical and acoustic crates from sibling workspaces.
math-iir-fir = { version = "0.5", git = "https://github.com/pierreaubert/math-audio" }
math-optimisation = { version = "0.5", git = "https://github.com/pierreaubert/math-audio" }
math-dsp = { version = "0.5", git = "https://github.com/pierreaubert/math-audio" }
math-rir = { version = "0.5", git = "https://github.com/pierreaubert/math-audio" }
autoeq-core = { path = "../autoeq/crates/autoeq-core" }
autoeq-optim = { path = "../autoeq/crates/autoeq-optim" }
autoeq-optim-types = { path = "../autoeq/crates/autoeq-optim-types" }
autoeq-workflow = { path = "../autoeq/crates/autoeq-workflow" }
roomeq-dsp = { path = "../autoeq/crates/roomeq-dsp" }
roomeq-engine = { path = "../autoeq/crates/roomeq-engine" }
roomeq-model = { path = "../autoeq/crates/roomeq-model" }
roomeq-workflow = { path = "../autoeq/crates/roomeq-workflow" }
autoeq-measurements = { version = "0.5.4", path = "../autoeq/crates/autoeq-measurements" }

# Symphonia add-ons from the sibling workspace.
symphonia-codec-wavpack = { version = "0.1.1", git = "https://github.com/pierreaubert/symphonia-add-ons" }

# GPUI toolkit
gpui-d3rs = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-px = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-audio-kit = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-design-tools = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-ui-kit = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-themes = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-builder = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-design = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-keybinding = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }
gpui-ios = { version = "0.11", git = "https://github.com/pierreaubert/gpui-toolkit" }

# SotF
sotf-host = { path = "../sotf-daw/crates/sotf-plugins/crates/sotf-host", default-features = false }
sotf-mpd = { path = "crates/sotf-server/crates/sotf-mpd" }
sotf-services = { path = "crates/sotf-server/crates/sotf-services", default-features = false }
sotf-service-tidal = { path = "crates/sotf-server/crates/sotf-service-tidal", default-features = false }
sotf-service-spotify = { path = "crates/sotf-server/crates/sotf-service-spotify", default-features = false }
sotf-dlna = { path = "crates/sotf-server/crates/sotf-dlna" }
sotf-cast = { path = "crates/sotf-server/crates/sotf-cast" }
sotf-federation = { path = "crates/sotf-server/crates/sotf-federation" }
sotf-tls = { path = "crates/sotf-server/crates/sotf-tls" }
sotf-testkit = { path = "../sotf-daw/crates/sotf-testkit" }
sotf-test = { path = "../sotf-daw/crates/sotf-test-macros" }
sotf-player = { path = "crates/sotf-player" }
sotf-engine = { path = "../sotf-daw/crates/sotf-engine", default-features = false }
sotf-room-eq-graph = { path = "../sotf-daw/crates/sotf-room-eq-graph" }
sotf-capture = { path = "../sotf-capture" }
sotf-midi = { path = "../sotf-daw/crates/sotf-midi" }
sotf-plugins = { path = "../sotf-daw/crates/sotf-plugins", default-features = false }
plugins-gpui = { path = "../sotf-daw/crates/sotf-plugins/crates/plugins-gpui" }
driver-hal = { path = "../sotf-daw/crates/driver-hal" }  # macOS only

# audio
cpal = "0.18.2"
hound = "3.5"
id3 = "1"
lofty = "0.25.5"
rubato = { version = "5.0.0",  package = "sotf-rubato",  git = "https://github.com/pierreaubert/sotf-3rdparties" }
symphonia = { version = "0.6", default-features = false }
symphonia-core = "0.6"
symphonia-metadata = "0.6"
symphonia-bundle-flac = "0.6"
symphonia-bundle-mp3 = "0.6"
symphonia-codec-aac = "0.6"
symphonia-codec-alac = "0.6"
symphonia-codec-pcm = "0.6"
symphonia-codec-vorbis = "0.6"
symphonia-format-riff = "0.6"
symphonia-format-ogg = "0.6"
symphonia-format-isomp4 = "0.6"
rtrb = "0.4"

# TUI framework
ratatui = "0.30"
mpris-server = "0.9"
ratatui-image = { version = "11", default-features = false, features = ["serde", "crossterm", "image-defaults"] }
crossterm = "0.29"

# GPUI framework. The toolkit vendors the framework under namespaced Cargo
# packages; the dependency keys preserve the Rust crate names used by SOTF.
# Resolve every backend from the same gpui-toolkit checkout.
gpui = { package = "sotf-gpui-toolkit-gpui", version = "0.2.3", git = "https://github.com/pierreaubert/sotf-3rdparties" }
gpui_macos = { package = "sotf-gpui-toolkit-gpui-macos", version = "0.1.2", features = ["font-kit"], git = "https://github.com/pierreaubert/sotf-3rdparties" }
gpui_linux = { package = "sotf-gpui-toolkit-gpui-linux", version = "0.1.0", git = "https://github.com/pierreaubert/sotf-3rdparties" }
gpui_windows = { package = "sotf-gpui-toolkit-gpui-windows", version = "0.1.2", git = "https://github.com/pierreaubert/sotf-3rdparties" }

# System and low-level
crossbeam = "0.8"

# Utilities
sha2 = "0.11"
toml = "1.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Proc macro dependencies
proptest = "1.9"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# Graphics and visualization
glam = "0.34.1"
image = "0.25"

# GPU and macOS graphics
oslog = "0.2"
core-foundation = "0.10"
winresource = "0.1"

# objc2 framework bindings (macOS)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-media-player = "0.3"
block2 = "0.6"

# Media controls
sotf-media-controls = { path = "crates/sotf-media-controls" }

# Camera capture

# QR code decoding from camera
rqrr = "0.11.0"

# RNNoise (pure Rust)

# ONNX Runtime — tract-onnx is a pure-Rust CPU-only ONNX runtime maintained
# by Sonos. Replaced the C++ Microsoft ORT (`ort` crate) here because we only
# need single-tensor CPU inference for the upmixer's vocal detector and the
# pure-Rust path eliminates the native libonnxruntime build dependency.

# Font-stack helper crate (Zed fork of font-kit)

# TUI extensions


[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency conflicts (e.g. wit-bindgen 0.51 vs 0.57) are not
# fixable from this workspace.
multiple_crate_versions = "allow"
# `if denom > 0 { a / denom } else { fallback }` reads more clearly than
# `a.checked_div(denom).unwrap_or(fallback)` for percent / rate computations
# scattered across the audio engine.
manual_checked_ops = "allow"

[profile.dev]
opt-level = 1
split-debuginfo= "packed"
debug = 1
codegen-units = 256

[profile.release]
# `release` is the everyday optimised profile — used by CI, `just prod-*`,
# benchmarks, and local release iteration. Thin LTO keeps cross-crate inlining
# without the serial bottleneck of fat LTO, and 14 codegen units balance
# parallelism with optimiser visibility. Compile time stays in the few-minute
# range on typical hardware.
lto = "thin"
codegen-units = 14
panic = "unwind"  # Changed from "abort" to allow tests to run
# debug = true # Keeps debug symbols for profiling

# `dist` is the "cut a release" profile. Inherits everything from `release`
# (including panic=unwind) and tightens for maximum runtime performance at the
# cost of much longer compile time. Use via `cargo build --profile dist` —
# artifacts land in `target/dist/` instead of `target/release/`. The Justfile
# `dist-*` recipes wrap this for the shipping binaries.
#
# Tradeoffs vs `release`:
#   - lto = "fat"           — whole-program LTO across all crates. Serial,
#                             single-threaded final link; typically 5-10x
#                             slower than thin LTO. Worth it for the binary
#                             that ships to users.
#   - codegen-units = 1     — single codegen unit per crate maximises the
#                             optimiser's view, enables aggressive inlining
#                             and dead-code elimination.
#   - incremental = false   — incremental cache is useless for a release cut
#                             and can suppress some optimisations.
#   - strip is intentionally NOT set; macOS distribution scripts run
#     `dsymutil` before stripping so they can ship .dSYM bundles for crash
#     symbolication. Linux scripts strip with `strip -v` post-build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Explicit size-optimised profile for measuring and shipping small desktop
# binaries. It preserves unwind semantics for plugin/host panic boundaries,
# but strips the final executable and lets LLVM optimise for size.
[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"

# SOTF owned maintenance forks; upstream 2.1.1, local version 2.1.2.

# Match GPUI compatibility forks: workspace patches are not inherited.
# The pinned CoreAudio fork preserves callback buffer capacity accounting.

# Keep Vello's crates.io wgpu dependency on the same Zed fork used by GPUI.
# Dependency patches are root-workspace configuration and are not inherited
# from the gpui-toolkit git dependency.

[patch.crates-io]
block = { git = "https://github.com/pierreaubert/sotf-3rdparties", rev = "5a4634af0916b5f53effa5ef6340efd90af32285" }

