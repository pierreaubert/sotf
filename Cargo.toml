resolver = "3"

[workspace.package]
version = "0.7.11"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "Optimise the sound of your speakers or your headphones"
edition = "2024"
documentation = "https://docs.rs/sotf"
license = "GPL-3.0-or-later"
repository = "https://github.com/pierreaubert/sotf"
keywords = ["audio", "dsp", "eq"]
categories = ["multimedia::audio"]
readme = "README.md"

[workspace.dependencies]
# Serialization and data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.2"
build_html = "2.7"

# Async and networking
# ideally we would use only threads or only tokio
anyhow = { version = "1.0" }
assert_fs = "1.0"
m3u8-rs = { version = "6" }
librespot-core = { version = "0.6" }
librespot-playback = { version = "0.6" }
librespot-metadata = { version = "0.6" }
librespot-oauth = { version = "0.6" }
librespot-protocol = { version = "0.6" }
oauth2 = { version = "4.4" }
rcgen = "0.13"
rustls = "0.23"
socket2 = "0.6"
tokio-rustls = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "io-util", "process", "signal"] }
# tokio-tungstenite = "0.21"
signal-hook = "0.4"
reqwest = { version = "0.13", features = ["json"] }
url = "2"
urlencoding = "2.1"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
futures = "0.3"

# CLI and system
base64 = "0.22"
chacha20poly1305 = "0.10"
byteorder = "1.5"
coreaudio-rs = "0.13"
core-foundation-sys = "0.8"
dispatch2 = "0.3"
flate2 = { version = "1.1" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
hex = "0.4"
ctrlc = { version = "3.5", features = ["termination"] }
directories = "6"
env_logger = "0.11"
libc = "0.2"
log = "0.4.28"
memmap2 = "0.9"
mimalloc = { version = "0.1" }
notify = { version = "8.2" }
libloading = { version = "0.8" }
rand_chacha = "0.10"
num_cpus = "1.17"
regex = "1.12"
rfd = "0.16"
# bundled SQLite is enabled per-app (app-gpui, app-tui, app-cli, sotf-tools);
# library crates take the workspace dep bare so dev `cargo check -p <lib>`
# doesn't pay for the C compile. Feature unification re-enables `bundled`
# automatically when a shipping app is in the build graph.
rusqlite = { version = "0.38" }
rust-embed = "8"
smol = "2"
strsim = "0.11"
tempfile = "3.23"
thiserror = "2.0.17"
criterion = "0.8.1"
insta = { version = "1.42", features = ["json"] }
serial_test = "3"
which = "8"
walkdir = "2"
qrcode = "0.14"
windows-sys = "0.61"

# Optimization and math
ndarray = { version = "0.17", default-features = false, features = ["rayon", "serde"] }
oxiblas-ndarray = { version = "0.2.1" }
rand = "0.10.2"
num-complex = "0.4"
num-traits = "0.2"
rayon = "1.11"
rustfft = "6.4"
realfft = "3.5"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
metaheuristics-nature = "10.1"

# using git version
math-test-functions = { git = "https://github.com/pierreaubert/math-audio", version = "0.5", default-features = false }
math-delaunay = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
math-iir-fir = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
math-optimisation = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
math-dsp = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
math-rir = { git = "https://github.com/pierreaubert/math-audio", version = "0.5" }
sofa-reader = { git = "https://github.com/pierreaubert/sofa-reader", version = "0.1.6" }
autoeq = { git = "https://github.com/pierreaubert/autoeq", version=">=0.5.54" }

# using git version
symphonia-codec-dsd = { git = "https://github.com/pierreaubert/symphonia-add-ons", version = "0.1.0" }
symphonia-codec-dst = { git = "https://github.com/pierreaubert/symphonia-add-ons", version = "0.1.0" }
symphonia-codec-wavpack = { git = "https://github.com/pierreaubert/symphonia-add-ons", version = "0.1.0" }
symphonia-format-sacd = { git = "https://github.com/pierreaubert/symphonia-add-ons", version = "0.1.0" }

# GPUI toolkit
gpui-d3rs = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-px = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-audio-kit = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-component-lab = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-design-tools = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-ui-kit = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "feat/issue-29-adaptive-overflow" }
gpui-ui-kit-macros = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-themes = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-miniapp = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-builder = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "feat/issue-29-adaptive-overflow" }
gpui-design = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-keybinding = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-pretext = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-ios = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }
gpui-au = { version = "0.9", git = "https://github.com/pierreaubert/gpui-toolkit", branch = "main" }

# SotF
sotf-host = { path = "crates/sotf-plugins/crates/sotf-host", default-features = false }
sotf-plugin-ab-compare = { path = "crates/sotf-plugins/crates/sotf-plugin-ab-compare" }
