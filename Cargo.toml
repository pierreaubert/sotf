sotf-plugin-crossover = { path = "crates/sotf-plugins/crates/sotf-plugin-crossover" }
sotf-plugin-delay = { path = "crates/sotf-plugins/crates/sotf-plugin-delay" }
sotf-plugin-de-esser = { path = "crates/sotf-plugins/crates/sotf-plugin-de-esser" }
sotf-plugin-dynamic-eq = { path = "crates/sotf-plugins/crates/sotf-plugin-dynamic-eq" }
sotf-plugin-denoiser = { path = "crates/sotf-plugins/crates/sotf-plugin-denoiser" }
sotf-plugin-speech-denoiser = { path = "crates/sotf-plugins/crates/sotf-plugin-speech-denoiser" }
sotf-plugin-hiss-reducer = { path = "crates/sotf-plugins/crates/sotf-plugin-hiss-reducer" }
sotf-plugin-declick = { path = "crates/sotf-plugins/crates/sotf-plugin-declick" }
sotf-plugin-dither = { path = "crates/sotf-plugins/crates/sotf-plugin-dither" }
sotf-plugin-downmix = { path = "crates/sotf-plugins/crates/sotf-plugin-downmix" }
sotf-plugin-eq = { path = "crates/sotf-plugins/crates/sotf-plugin-eq" }
sotf-plugin-gain = { path = "crates/sotf-plugins/crates/sotf-plugin-gain" }
sotf-plugin-gate = { path = "crates/sotf-plugins/crates/sotf-plugin-gate" }
sotf-plugin-hal-input = { path = "crates/sotf-plugins/crates/sotf-plugin-hal-input" }
sotf-plugin-hal-output = { path = "crates/sotf-plugins/crates/sotf-plugin-hal-output" }
sotf-plugin-linear-phase-eq = { path = "crates/sotf-plugins/crates/sotf-plugin-linear-phase-eq" }
