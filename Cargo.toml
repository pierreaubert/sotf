sotf-plugin-matrix = { path = "crates/sotf-plugins/crates/sotf-plugin-matrix" }
sotf-plugin-mono-to-stereo = { path = "crates/sotf-plugins/crates/sotf-plugin-mono-to-stereo" }
sotf-plugin-multiband-compressor = { path = "crates/sotf-plugins/crates/sotf-plugin-multiband-compressor" }
sotf-plugin-multiband-expander = { path = "crates/sotf-plugins/crates/sotf-plugin-multiband-expander" }
sotf-plugin-pnd = { path = "crates/sotf-plugins/crates/sotf-plugin-pnd" }
sotf-plugin-resampler = { path = "crates/sotf-plugins/crates/sotf-plugin-resampler" }
sotf-plugin-saturation = { path = "crates/sotf-plugins/crates/sotf-plugin-saturation" }
sotf-plugin-spectral-compressor = { path = "crates/sotf-plugins/crates/sotf-plugin-spectral-compressor" }
sotf-plugin-stereo-imager = { path = "crates/sotf-plugins/crates/sotf-plugin-stereo-imager" }
sotf-plugin-transient-shaper = { path = "crates/sotf-plugins/crates/sotf-plugin-transient-shaper" }
sotf-plugin-upmixer = { path = "crates/sotf-plugins/crates/sotf-plugin-upmixer", default-features = false }
sotf-plugin-xtc = { path = "crates/sotf-plugins/crates/sotf-plugin-xtc" }
sotf-iamf = { path = "crates/sotf-iamf" }
sotf-streaming = { path = "crates/sotf-server/crates/sotf-streaming" }
sotf-mpd = { path = "crates/sotf-server/crates/sotf-mpd" }
sotf-services = { path = "crates/sotf-server/crates/sotf-services", default-features = false }
sotf-service-tidal = { path = "crates/sotf-server/crates/sotf-service-tidal", default-features = false }
sotf-service-spotify = { path = "crates/sotf-server/crates/sotf-service-spotify", default-features = false }
sotf-dlna = { path = "crates/sotf-server/crates/sotf-dlna" }
sotf-cast = { path = "crates/sotf-server/crates/sotf-cast" }
sotf-federation = { path = "crates/sotf-server/crates/sotf-federation" }
sotf-tls = { path = "crates/sotf-server/crates/sotf-tls" }
sotf-engine = { path = "crates/sotf-engine", default-features = false }
sotf-testkit = { path = "crates/sotf-testkit" }
sotf-test = { path = "crates/sotf-test-macros" }
sotf-player = { path = "crates/sotf-player" }
sotf-midi = { path = "crates/sotf-midi" }
sotf-plugins = { path = "crates/sotf-plugins", default-features = false }
plugins-gpui = { path = "crates/sotf-plugins/crates/plugins-gpui" }
plugins-denoiser = { path = "crates/sotf-plugins/crates/plugins-denoiser" }
plugins-spatial = { path = "crates/sotf-plugins/crates/plugins-spatial" }
driver-common = { path = "crates/systemwide/crates/driver-common" }
driver-hal = { path = "crates/systemwide/crates/driver-hal" }  # macOS only

# audio
cpal = "0.17"
hound = "3.5"
id3 = "1.16.3"
lofty = "0.22"
rubato = "1.0"
audioadapter-buffers = "2.0"
symphonia = { version = "0.6", default-features = false }
symphonia-core = "0.6"
symphonia-metadata = "0.6"
symphonia-bundle-flac = "0.6"
symphonia-bundle-mp3 = "0.6"
symphonia-codec-aac = "0.6"
symphonia-codec-alac = "0.6"
symphonia-codec-pcm = "0.6"
symphonia-codec-vorbis = "0.6"
symphonia-format-riff = "0.6"
symphonia-format-ogg = "0.6"
symphonia-format-isomp4 = "0.6"
dst-decoder = { git = "https://github.com/pierreaubert/symphonia-add-ons" }
rdsd2pcm = { git = "https://github.com/pierreaubert/symphonia-add-ons" }
encoding_rs = "0.8"
rtrb = "0.4"
midir = "0.10"

# TUI framework
ratatui = "0.30"
mpris-server = "0.9"
ratatui-image = { version = "10", default-features = false, features = ["serde", "crossterm", "image-defaults"] }
crossterm = "0.29"

# GPUI framework - all packages must use the same git revision
gpui = { version="0.2.2", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0" }
gpui_macos = { version="0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0", features = ["font-kit"] }
gpui_linux = { version="0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0" }
gpui_windows = { version="0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0" }
gpui_wgpu = { version="0.1.1", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0" }

# System and low-level
objc = "0.2"
cocoa = "0.26"
objc2-core-audio = { version = "0.3", default-features = false }
crossbeam = "0.8"
arc-swap = "1"

# Utilities
unicode-segmentation = "1"
sha2 = "0.10"
toml = "0.8"
approx = "0.5"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
bincode = { version = "2.0.1", features = ["serde"] }

# Proc macro dependencies
proc-macro2 = "1"
quote = "1"
proptest = "1.9"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }

# Graphics and visualization
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.33"
pollster = "1"
image = "0.25"
fontdue = "0.9"
delaunator = "1.0"
raw-window-handle = "0.6"
pathfinder_geometry = "0.5"

# GPU and macOS graphics
oslog = "0.2"
metal = "0.33"
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "=21.0.0"
winresource = "0.1"

# objc2 framework bindings (macOS)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-app-kit = "0.3"
objc2-media-player = "0.3"
block2 = "0.6"

# Media controls
sotf-media-controls = { path = "crates/sotf-media-controls" }

# Camera capture
nokhwa = { version = "0.10", default-features = false }

# QR code decoding from camera
rqrr = "0.10.0"

# RNNoise (pure Rust)
nnnoiseless = "0.1"

# ONNX Runtime — tract-onnx is a pure-Rust CPU-only ONNX runtime maintained
# by Sonos. Replaced the C++ Microsoft ORT (`ort` crate) here because we only
# need single-tensor CPU inference for the upmixer's vocal detector and the
# pure-Rust path eliminates the native libonnxruntime build dependency.
tract-onnx = "0.22"

# Font-stack helper crate (Zed fork of font-kit)
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269" }

# TUI extensions

cbindgen = "0.28"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives

# These lints are from the `restriction` lint group and prevent specific
# constructs being used in source code in order to drive up consistency,
# quality, and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency conflicts (e.g. wit-bindgen 0.51 vs 0.57) are not
# fixable from this workspace.
multiple_crate_versions = "allow"
# `if denom > 0 { a / denom } else { fallback }` reads more clearly than
# `a.checked_div(denom).unwrap_or(fallback)` for percent / rate computations
# scattered across the audio engine.
manual_checked_ops = "allow"

[profile.dev]
opt-level = 1
split-debuginfo= "packed"
debug = 1
codegen-units = 256

[profile.release]
# `release` is the everyday optimised profile — used by CI, `just prod-*`,
# benchmarks, and local release iteration. Thin LTO keeps cross-crate inlining
# without the serial bottleneck of fat LTO, and 14 codegen units balance
# parallelism with optimiser visibility. Compile time stays in the few-minute
# range on typical hardware.
lto = "thin"
codegen-units = 14
panic = "unwind"  # Changed from "abort" to allow tests to run
# debug = true # Keeps debug symbols for profiling

# `dist` is the "cut a release" profile. Inherits everything from `release`
# (including panic=unwind) and tightens for maximum runtime performance at the
# cost of much longer compile time. Use via `cargo build --profile dist` —
# artifacts land in `target/dist/` instead of `target/release/`. The Justfile
# `dist-*` recipes wrap this for the shipping binaries.
#
# Tradeoffs vs `release`:
#   - lto = "fat"           — whole-program LTO across all crates. Serial,
#                             single-threaded final link; typically 5-10x
#                             slower than thin LTO. Worth it for the binary
#                             that ships to users.
#   - codegen-units = 1     — single codegen unit per crate maximises the
#                             optimiser's view, enables aggressive inlining
#                             and dead-code elimination.
#   - incremental = false   — incremental cache is useless for a release cut
#                             and can suppress some optimisations.
#   - strip is intentionally NOT set; macOS distribution scripts run
#     `dsymutil` before stripping so they can ship .dSYM bundles for crash
#     symbolication. Linux scripts strip with `strip -v` post-build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Explicit size-optimised profile for measuring and shipping small desktop
# binaries. It preserves unwind semantics for plugin/host panic boundaries,
# but strips the final executable and lets LLVM optimise for size.
[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"

# Patches for tvOS/watchOS/visionOS support (Tier 3 Apple platforms):
# - coreaudio-rs: cfg(target_os = "ios") doesn't include tvos
[patch.crates-io]
nnnoiseless = { path = "crates/3rdparties/nnnoiseless" }
coreaudio-rs = { path = "crates/3rdparties/coreaudio-rs" }
psm = { path = "crates/3rdparties/psm" }

[patch."https://github.com/zed-industries/zed.git"]
gpui = {
  git = "https://github.com/pierreaubert/gpui-toolkit",
  branch = "main",
  package = "gpui"
}
gpui_wgpu = {
  version = "0.1.1",
  git = "https://github.com/pierreaubert/gpui-toolkit",
  branch = "main",
  package = "gpui_wgpu"
}
gpui_macos = { 
  git = "https://github.com/pierreaubert/gpui-toolkit", 
  branch = "main", 
  package = "gpui_macos" 
}
