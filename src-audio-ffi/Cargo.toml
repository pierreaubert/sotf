[package]
name = "sotf-audio-ffi"
version = "0.2.466"
edition = "2021"
authors = ["AutoEQ Team"]
description = "C FFI bindings for SOTF audio plugins (for Audio Unit integration)"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
sotf-audio = { path = "../src-audio" }
autoeq-iir = { path = "../src-iir" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
