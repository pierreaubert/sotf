[package]
name = "d3rs"
version = "0.1.0"
edition = "2021"
authors = ["Pierre"]
description = "D3.js-inspired plotting library for GPUI with div-based rendering"
license = "MIT OR Apache-2.0"
keywords = ["gpui", "plotting", "visualization", "d3", "charts"]
categories = ["visualization", "gui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git" }

[dev-dependencies]
approx = "0.5"

[[example]]
name = "scale_demo"
path = "examples/scale_demo.rs"

[[example]]
name = "axis_demo"
path = "examples/axis_demo.rs"

[[example]]
name = "grid_demo"
path = "examples/grid_demo.rs"

[[example]]
name = "bar_chart_demo"
path = "examples/bar_chart_demo.rs"

[[example]]
name = "scatter_demo"
path = "examples/scatter_demo.rs"

[[example]]
name = "line_chart_demo"
path = "examples/line_chart_demo.rs"
