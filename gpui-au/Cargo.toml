[package]
name = "gpui-au"
version = "0.5.3"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "gpui_au_test"
path = "src/bin/test_embedded.rs"

# This crate is macOS-only (Audio Unit plugin)
[target.'cfg(target_os = "macos")'.dependencies]
parking_lot = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

# GPUI framework for UI
gpui = { workspace = true }

# Audio player types and UI
sotf-audio-player = { path = "../sotf-audio-player" }
math-iir-fir = { workspace = true }
gpui-ui-kit = { path = "../gpui-ui-kit" }

# Embed assets
rust-embed = "8"

# Low-level macOS bindings for NSView extraction
objc = { workspace = true }
cocoa = { workspace = true }

# Metal for GPU rendering
metal = "0.32"
core-graphics = "0.24"
core-foundation = "0.10"

# For lazy_static class registration
lazy_static = "1.4"
