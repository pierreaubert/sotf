[package]
name = "bem"
version = "0.1.0"
edition = "2021"
authors = ["SOTF Contributors"]
description = "High-performance Boundary Element Method library for acoustic scattering"
license = "EUPL-1.2"
repository = "https://github.com/pierreaubert/sotf"
keywords = ["bem", "boundary-element", "acoustics", "numerical", "hrtf"]
categories = ["science", "mathematics", "simulation"]

[lib]
name = "bem"
path = "src/lib.rs"

[[bin]]
name = "bem-runner"
path = "src/bin/runner.rs"
required-features = ["cli"]

[dependencies]
# Core numerical computing
ndarray = { version = "0.15", features = ["rayon", "blas"] }
num-complex = "0.4"
num-traits = "0.2"

# Linear algebra (NO async, pure compute)
ndarray-linalg = { version = "0.16", features = ["openblas-static"] }

# Parallel processing - RAYON ONLY (NO TOKIO)
rayon = "1.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization (for JSON output)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Special functions (for analytical solutions)
special = "0.10"  # Bessel, Hankel, Legendre functions

# Time/date for metadata
chrono = { version = "0.4", features = ["serde"] }

# CLI (optional)
clap = { version = "4.0", features = ["derive"], optional = true }

# Memory profiling
memory-stats = "1.0"

# System information (for resource monitoring)
sysinfo = "0.30"

# Process/executable finding
which = "6.0"

# Benchmarking
criterion = { version = "0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"  # For floating-point comparisons in tests
proptest = "1.0"  # Property-based testing

[build-dependencies]
cc = "1.0"  # For compiling NumCalc C++ code

[features]
default = ["ffi"]
ffi = []  # FFI wrapper to NumCalc
pure-rust = []  # Pure Rust BEM implementation (future)
cli = ["clap"]
benchmarks = ["criterion"]

# Memory optimization features
memory-optimized = []
out-of-core = []  # Stream data from disk for very large problems

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true

[profile.bench]
inherits = "release"
debug = true

[profile.test]
opt-level = 2  # Faster tests while keeping debug info

# Memory profiling profile
[profile.memory]
inherits = "release"
debug = true
strip = false
