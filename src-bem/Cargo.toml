[package]
name = "sotf_bem"
version = "0.1.1"
edition = { workspace = true }
authors = { workspace = true }
description = "High-performance Boundary Element Method library for acoustic scattering"
license = { workspace = true }
repository = { workspace = true }
keywords = ["bem", "boundary-element", "acoustics", "numerical", "hrtf"]
categories = ["science", "mathematics", "simulation"]

[lib]
name = "bem"
path = "src/lib.rs"

[[bin]]
name = "bem-runner"
path = "bin/runner.rs"
required-features = ["cli"]

[dependencies]
# Core numerical computing
ndarray = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
ndarray-linalg = { workspace = true }
special = { workspace = true }
spec_math = { workspace = true }

# Environment utilities
autoeq-env = { path = "../src-env" }

# Parallel processing - RAYON ONLY (NO TOKIO)
rayon = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization (for JSON output)
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Time/date for metadata
chrono = { workspace = true }

# CLI (optional)
clap = { workspace = true }

# Memory profiling
memory-stats = "1.0"

# System information (for resource monitoring)
sysinfo = "0.37"
num_cpus = { workspace = true }

# Process/executable finding
which = { workspace = true }

# Benchmarking
criterion = { version = "0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"  # For floating-point comparisons in tests
proptest = "1.0"  # Property-based testing

[build-dependencies]
cc = "1.0"  # For compiling NumCalc C++ code
which = { workspace = true }

[features]
default = ["ffi"]
ffi = []  # FFI wrapper to NumCalc
pure-rust = []  # Pure Rust BEM implementation (future)
cli = []
benchmarks = ["criterion"]

# Memory optimization features
memory-optimized = []
out-of-core = []  # Stream data from disk for very large problems

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true

[profile.bench]
inherits = "release"
debug = true

[profile.test]
opt-level = 2  # Faster tests while keeping debug info

# Memory profiling profile
[profile.memory]
inherits = "release"
debug = true
strip = false
