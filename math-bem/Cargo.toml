[package]
name = "math-bem"
version = "0.1.3"
edition = { workspace = true }
authors = { workspace = true }
description = "High-performance Boundary Element Method library for acoustic scattering"
license = { workspace = true }
repository = { workspace = true }
keywords = ["bem", "boundary-element", "acoustics", "numerical", "hrtf"]
categories = ["science", "mathematics", "simulation"]

[lib]
name = "bem"
path = "src/lib.rs"

[[bin]]
name = "bem-runner"
path = "bin/runner.rs"
required-features = ["cli", "ffi"]

[[bin]]
name = "room-simulator-bem"
path = "bin/room_simulator_bem.rs"

[dependencies]
# Core numerical computing
ndarray = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
ndarray-linalg = { workspace = true }
special = { workspace = true }
spec_math = { workspace = true }

# Environment utilities
autoeq-env = { version="0.2" }

# Parallel processing - RAYON ONLY (NO TOKIO)
rayon = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization (for JSON/TOML output)
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Time/date for metadata
chrono = { workspace = true }

# CLI (optional)
clap = { workspace = true }

# Memory profiling
memory-stats = "1.2"

# System information (for resource monitoring)
sysinfo = "0.37"
num_cpus = { workspace = true }

# Process/executable finding
which = { workspace = true }

# Benchmarking
criterion = { version = "0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"  # For floating-point comparisons in tests
proptest = "1.9"  # Property-based testing

[build-dependencies]
cc = "1.2"  # For compiling NumCalc C++ code
which = { workspace = true }

[features]
default = ["parallel", "pure-rust", "cli", "benchmarks"]
ffi = []  # FFI wrapper to NumCalc
pure-rust = []  # Pure Rust BEM implementation
parallel = []  # Parallel TBEM assembly using Rayon
cli = []
benchmarks = ["criterion"]

# Memory optimization features
memory-optimized = []
out-of-core = []  # Stream data from disk for very large problems

# Examples that require specific features
[[example]]
name = "simple_sphere_test"
required-features = ["pure-rust"]

