[package]
name = "sotf-hal"
version = "0.2.1"
edition = "2021"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
license = "GPL 3.0"
description = "Simplified Core Audio HAL driver with bidirectional audio buffers"

[lib]
name = "sotf_hal"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "hal-loopback"
path = "bin/test_loopback.rs"

# This crate is macOS-only (Core Audio HAL driver)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Lock-free ring buffer
rb = "0.4"

# Logging and error handling
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
anyhow = "1.0"

# Audio
crossbeam = "0.8"

# Core Audio integration
coreaudio-sys = "0.2"
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.23"
