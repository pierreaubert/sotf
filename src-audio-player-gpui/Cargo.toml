[package]
name = "sotf-audio-player-gpui"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "GPUI music player frontend for SOTF"
license.workspace = true
repository.workspace = true

[dependencies]
# GPUI framework
gpui = { git = "https://github.com/zed-industries/zed.git" }

# Shared audio player library (provides business logic, database, plugins, etc.)
sotf-audio-player = { path = "../src-audio-player" }

# Audio engine (re-exported by shared library, but needed for direct use)
sotf_audio = { path = "../src-audio" }

# CLI
clap = { workspace = true }

# Logging (GPUI-specific)
env_logger = "0.11"

# Metadata parsing (used for library scanning, not in shared library)
id3 = "1.16"
metaflac = "0.2"

# Serialization (for GPUI-specific state)
serde = { workspace = true }
serde_json = { workspace = true }

# Smol runtime (used by GPUI)
smol = "2.0"

[[bin]]
name = "sotf_player_gpui"
path = "src/main.rs"
