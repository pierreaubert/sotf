[package]
name = "sotf-audio-player-tui"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "TUI music player for SOTF"
license.workspace = true
repository.workspace = true

[lib]
name = "sotf_audio_player_tui"
path = "src/lib.rs"

[[bin]]
name = "sotf_player_tui"
path = "src/main.rs"

[dependencies]
# Shared business logic
sotf-audio-player = { path = "../sotf-audio-player" }

# Audio engine
sotf-audio-engine = { path = "../sotf-audio-engine" }
sotf-audio-plugins = { path = "../sotf-audio-plugins" }

# TUI framework
ratatui = { workspace = true }
crossterm = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
parking_lot = { workspace = true }
serde_json = "1.0"

# ASCII art image rendering
image = "0.25"
ratatui-image = { version = "1.0", features = ["serde"] }
