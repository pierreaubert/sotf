[package]
name = "sotf-engine"
description = "an audio player and recorder that support audio plugins"
version = "1.0.16"
edition.workspace = true

[lib]
name = "sotf_audio"
path = "src/lib.rs"

[features]
default = []
hal = ["driver-hal", "sotf-plugins/hal"]
asio = ["cpal/asio"]
iamf = ["dep:sotf-iamf", "dep:sotf-plugin-ambisonics"]
asio = ["cpal/asio"]
iamf = ["dep:sotf-iamf", "dep:sotf-plugin-ambisonics"]

[dependencies]
driver-common = { workspace = true }
tokio = { workspace = true }
ndarray = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
arc-swap = { workspace = true }
crossbeam = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true }
autoeq-env = { workspace = true }
math-iir-fir = { workspace = true }
math-dsp = { workspace = true }
sotf-plugins = { workspace = true }
sotf-iamf = { workspace = true, optional = true }
sotf-plugin-ambisonics = { workspace = true, optional = true }
num-complex = { workspace = true }

# TUI framework
ratatui = { workspace = true }
crossterm = { workspace = true }

# Audio decoding/encoding
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-codec-alac = { workspace = true }
symphonia-codec-pcm = { workspace = true }
symphonia-codec-vorbis = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
id3 = { workspace = true }
metaflac = { workspace = true }
rtrb = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
driver-hal = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
sofa-reader = { workspace = true }
