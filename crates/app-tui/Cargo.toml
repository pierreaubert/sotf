[package]
name = "sotf-tui"
version = "0.5.202"
authors.workspace = true
edition.workspace = true
description = "TUI music player frontend for SOTF"
license.workspace = true
repository.workspace = true
# Disable auto-discovery: unit test files in tests/ are included via #[path] in lib modules.
autotests = false

[dependencies]
# Shared audio player library (provides business logic, database, plugins, etc.)
sotf-player = { workspace = true }

# Audio engine
sotf-plugins = { workspace = true }
sotf-engine = { workspace = true }
math-iir-fir = { workspace = true }
autoeq = { workspace = true }

# TUI framework
ratatui = { workspace = true }
ratatui-image = { workspace = true }
crossterm = { workspace = true }

# Synchronous mutex (faster than std::sync::Mutex)
parking_lot = { workspace = true }

# Numerical arrays (for autoeq Curve construction)
ndarray = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# File system and utilities
walkdir = { workspace = true }

# Audio metadata
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
ebur128 = { workspace = true }

# Image processing for album art thumbnails
image = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Utilities
chrono = { workspace = true }
directories = { workspace = true }
thiserror = { workspace = true }

# Media controls (Now Playing / media keys)
souvlaki = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSRunningApplication", "NSEvent"] }
objc2-foundation = { workspace = true, features = ["NSObjCRuntime", "NSString", "NSDate"] }
core-foundation-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "sotf_audio_player_tui"
path = "lib.rs"

[[bin]]
name = "sotf-tui"
path = "main.rs"

# Only parameter_sync_tests is a true integration test.
# The other files in tests/ are unit tests included via #[path] in lib modules.
[[test]]
name = "tests_parameter_sync"
path = "tests/tests_parameter_sync.rs"
