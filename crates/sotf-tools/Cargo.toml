[package]
name = "sotf-tools"
version = "0.5.7"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tools for generating test signal or converting formats"
license.workspace = true
repository.workspace = true

[[bin]]
name = "export-design-tokens"
path = "bin/export-design-tokens.rs"

[[bin]]
name = "import-design-tokens"
path = "bin/import-design-tokens.rs"

[[bin]]
name = "generate-audio-tests"
path = "bin/generate_audio_tests.rs"

[[bin]]
name = "generate-upmixer-golden"
path = "bin/generate_upmixer_golden.rs"

[[bin]]
name = "sofa-to-sqlite"
path = "bin/sofa_to_sqlite.rs"

[dependencies]
sotf-plugins = { workspace = true }
sotf-engine = { workspace = true }
sotf-gpui = { path = "../app-gpui" }
gpui = { workspace = true }

anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Vendor SQLite into shipping binaries (deterministic builds, no system dep).
rusqlite = { workspace = true, features = ["bundled"] }
bincode = { workspace = true }
hound = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
