[package]
name = "sofa-reader"
version = "0.1.5"
edition = "2024"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure-Rust SOFA (HDF5/NetCDF4) file reader and writer for HRTF data"

[features]
default = ["deflate"]
deflate = ["dep:flate2"]

[dependencies]
thiserror = "2.0"
flate2 = { version = "1.1", optional = true }
log = "0.4"
serde = { workspace = true }
rusqlite = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
tempfile = "3"
