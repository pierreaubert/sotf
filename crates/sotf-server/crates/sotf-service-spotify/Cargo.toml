[package]
name = "sotf-service-spotify"
description = "Spotify streaming service provider for SOTF (via librespot)"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
sotf-services = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
librespot-core = { workspace = true }
librespot-playback = { workspace = true }
librespot-protocol = { workspace = true }
# Version pin only (see workspace vergen comment): forces the transitive
# vergen required by librespot-core's build script back to 9.0.6.
vergen = { workspace = true }
oauth2 = { workspace = true }
reqwest = { workspace = true, features = ["json", "query", "blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
