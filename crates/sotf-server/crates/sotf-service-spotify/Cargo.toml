[package]
name = "sotf-service-spotify"
description = "Spotify streaming service provider for SOTF (via librespot)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
sotf-services = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
librespot-core = { workspace = true }
librespot-playback = { workspace = true }
librespot-oauth = { workspace = true }
librespot-protocol = { workspace = true }
oauth2 = { workspace = true }
reqwest = { workspace = true, features = ["json", "query"] }
# Same reqwest line oauth2 4.4 builds its blocking client against; needed so
# the custom token-exchange client (explicit 30 s timeout) can produce
# `oauth2::HttpResponse` values (http 0.2 types).
reqwest-blocking = { package = "reqwest", version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
