[package]
name = "sotf-services"
description = "Streaming service integrations (Spotify, Tidal) for SOTF"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
spotify = ["dep:librespot-core", "dep:librespot-playback", "dep:librespot-metadata"]
tidal = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
log = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread"] }

# Spotify (optional)
librespot-core = { workspace = true, optional = true }
librespot-playback = { workspace = true, optional = true }
librespot-metadata = { workspace = true, optional = true }

# Tidal (optional)
reqwest = { workspace = true, features = ["json", "query", "form"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
env_logger = { workspace = true }
