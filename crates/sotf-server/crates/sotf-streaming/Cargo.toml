[package]
name = "sotf-streaming"
description = "HTTP streaming input and live PCM output for SOTF audio engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
hls = ["dep:m3u8-rs"]

[dependencies]
log = { workspace = true }
symphonia-core = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
url = "2"

# HLS support
m3u8-rs = { version = "6", optional = true }

[dev-dependencies]
env_logger = { workspace = true }
