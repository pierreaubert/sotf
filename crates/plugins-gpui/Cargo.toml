[package]
name = "gpui-au"
version.workspace = true
edition.workspace = true

[features]
cargo-clippy = []

[lib]
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "gpui_au_test"
path = "src/bin/test_embedded.rs"

# This crate is macOS-only (Audio Unit plugin)
[target.'cfg(target_os = "macos")'.dependencies]
parking_lot = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

# GPUI framework for UI
gpui = { workspace = true }
gpui_macos = { workspace = true }

# Audio player types and UI
player = { workspace = true }
math-iir-fir = { workspace = true }
gpui-ui-kit = { workspace = true }

# Embed assets
rust-embed = { workspace = true }

# Low-level macOS bindings for NSView extraction
objc = { workspace = true }
cocoa = { workspace = true }

# Metal for GPU rendering
metal = { workspace = true }
core-graphics = { workspace = true }
core-foundation = { workspace = true }

# For lazy_static class registration
lazy_static = { workspace = true }
