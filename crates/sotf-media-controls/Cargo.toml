[package]
name = "sotf-media-controls"
version = "0.1.3"
authors.workspace = true
edition.workspace = true
description = "Cross-platform OS media controls (NowPlaying / MPRIS) for SOTF apps."
license.workspace = true
repository.workspace = true
keywords = ["audio", "media", "controls"]
categories = ["multimedia::audio"]

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = [
    "NSDate",
    "NSDictionary",
    "NSString",
    "NSValue",
    "NSObjCRuntime",
] }
objc2-media-player = { workspace = true, features = [
    "MPRemoteCommandCenter",
    "MPRemoteCommand",
    "MPRemoteCommandEvent",
    "MPNowPlayingInfoCenter",
    "MPMediaItem",
    "block2",
] }
block2 = { workspace = true }
dispatch2 = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
mpris-server = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[lints]
workspace = true
