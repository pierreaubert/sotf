[package]
name = "sotf-plugin-hal-input"
description = "SOTF HAL Input plugin - macOS audio HAL input"
version = "0.5.84"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_hal_input"
path = "src/lib.rs"

[features]
hal = ["driver-hal"]

[target.'cfg(target_os = "macos")'.dependencies]
driver-hal = { workspace = true, optional = true }

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
