name: SOTFAudioUnits
options:
  bundleIdPrefix: org.spinorama
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: 0.5.15
  CURRENT_PROJECT_VERSION: 1
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  SWIFT_VERSION: "6.0"

# Shared settings for all AU extension targets
targetTemplates:
  SOTFAudioUnitExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: GenericAU
        name: GenericAU
        createIntermediateGroups: true
      - path: Shared
        name: Shared
        createIntermediateGroups: true
        headerVisibility: public
    settings:
      SWIFT_OBJC_BRIDGING_HEADER: Shared/BridgingHeader.h
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Automatic
      LIBRARY_SEARCH_PATHS:
        - $(PROJECT_DIR)/Resources
      HEADER_SEARCH_PATHS:
        - $(PROJECT_DIR)/Shared
      SKIP_INSTALL: false
      EXTENSION_SAFE_API_ONLY: true
      OTHER_LDFLAGS:
        - -lsotf_audio_plugins_ffi
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Foundation.framework
      - sdk: IOKit.framework
      - sdk: IOSurface.framework

targets:
  # Main app container (required for App Extension)
  SOTFAudioUnits:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App
        createIntermediateGroups: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.spinorama.SOTFAudioUnits
      INFOPLIST_FILE: App/Info.plist
      CODE_SIGN_ENTITLEMENTS: App/SOTFAudioUnits.entitlements
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: EQAudioUnit
        embed: true
      - target: CompressorAudioUnit
        embed: true
      - target: LimiterAudioUnit
        embed: true
      - target: GateAudioUnit
        embed: true
      - target: GainAudioUnit
        embed: true
      - target: DelayAudioUnit
        embed: true
      - target: ExpanderAudioUnit
        embed: true
      - target: CrossfeedAudioUnit
        embed: true
      - target: SaturationAudioUnit
        embed: true
      - target: DenoiserAudioUnit
        embed: true
      - target: DownmixAudioUnit
        embed: true
      - target: MonoToStereoAudioUnit
        embed: true
      - target: StereoImagerAudioUnit
        embed: true
      - target: TransientShaperAudioUnit
