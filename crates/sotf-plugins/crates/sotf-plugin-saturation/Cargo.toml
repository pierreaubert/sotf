[package]
name = "sotf-plugin-saturation"
description = "SOTF Saturation / Harmonic Exciter plugin"
version = "0.5.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "sotf_plugin_saturation"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-saturation"
path = "bin/qa_saturation.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
