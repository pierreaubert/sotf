[package]
name = "sotf-plugin-hal-output"
description = "SOTF HAL Output plugin - macOS audio HAL output"
version = "0.5.9"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_hal_output"
path = "src/lib.rs"

[features]
hal = ["driver-hal"]

[target.'cfg(target_os = "macos")'.dependencies]
driver-hal = { workspace = true, optional = true }

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
