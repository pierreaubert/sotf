[package]
name = "sotf-plugin-transient-shaper"
description = "SOTF Transient Shaper plugin - SPL Transient Designer approach"
version = "0.5.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "sotf_plugin_transient_shaper"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-transient-shaper"
path = "bin/qa_transient_shaper.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
