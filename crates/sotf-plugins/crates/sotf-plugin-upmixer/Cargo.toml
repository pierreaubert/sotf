[package]
name = "sotf-plugin-upmixer"
description = "SOTF Upmixer plugin - stereo to surround upmixing"
version = "0.5.113"
edition.workspace = true

[lib]
name = "sotf_plugin_upmixer"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-upmixer"
path = "bin/qa_upmixer.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
log = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
ndarray = { workspace = true }
ort = { workspace = true }
realfft = { workspace = true }
rtrb = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
hound = { workspace = true }
serde_json = { workspace = true }
sotf-plugin-gain = { workspace = true }

[[bench]]
name = "upmixer-benchmark"
harness = false
