[package]
name = "sotf-plugin-dynamic-eq"
description = "SOTF Dynamic EQ plugin - frequency-selective dynamics"
version = "0.5.11"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "sotf_plugin_dynamic_eq"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-dynamic-eq"
path = "bin/qa_dynamic_eq.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
