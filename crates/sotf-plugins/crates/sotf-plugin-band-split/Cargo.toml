[package]
name = "sotf-plugin-band-split"
description = "SOTF Band Split plugin - split signal into frequency bands"
version = "0.5.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_band_split"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-band-split"
path = "bin/qa_band_split.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
