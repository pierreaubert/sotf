[package]
name = "sotf-plugin-resampler"
description = "SOTF Resampler plugin - sample rate conversion"
version = "0.5.21"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_resampler"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-resampler"
path = "bin/qa_resampler.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
log = { workspace = true }
