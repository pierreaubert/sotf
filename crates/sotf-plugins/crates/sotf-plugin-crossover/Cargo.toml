[package]
name = "sotf-plugin-crossover"
description = "SOTF Crossover plugin - frequency band splitting"
version = "0.5.30"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_crossover"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-crossover"
path = "bin/qa_crossover.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "crossover-block-benchmark"
harness = false
