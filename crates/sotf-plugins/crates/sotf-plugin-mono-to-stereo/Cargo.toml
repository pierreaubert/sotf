[package]
name = "sotf-plugin-mono-to-stereo"
description = "SOTF Mono to Stereo plugin - mono to stereo widening"
version = "0.5.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_mono_to_stereo"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-mono-to-stereo"
path = "bin/qa_mono_to_stereo.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
rustfft = { workspace = true }
serde_json = { workspace = true }
