[package]
name = "sotf-plugin-matrix"
description = "SOTF Matrix plugin - channel matrix mixing"
version = "0.5.89"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_matrix"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-matrix"
path = "bin/qa_matrix.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
sotf-plugin-channel-mute-solo = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
log = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
