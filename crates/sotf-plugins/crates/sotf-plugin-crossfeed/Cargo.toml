[package]
name = "sotf-plugin-crossfeed"
description = "SOTF Crossfeed plugin - stereo crossfeed for headphones"
version = "0.5.13"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_crossfeed"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-crossfeed"
path = "bin/qa_crossfeed.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
