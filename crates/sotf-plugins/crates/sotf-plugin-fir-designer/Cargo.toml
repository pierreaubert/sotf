[package]
name = "sotf-plugin-fir-designer"
description = "SOTF FIR Designer plugin - FIR magnitude and phase design"
version = "0.5.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "sotf_plugin_fir_designer"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-fir-designer"
path = "bin/qa_fir_designer.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
math-iir-fir = { workspace = true }
realfft = { workspace = true }
num-complex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
