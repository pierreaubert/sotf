[package]
name = "sotf-plugin-binaural"
description = "SOTF Binaural Decoder plugin - HRTF-based binaural rendering"
version = "0.5.23"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_binaural"
path = "src/lib.rs"

[dependencies]
sotf-host = { workspace = true }
plugins-spatial = { workspace = true }
math-dsp = { workspace = true }
math-rir = { workspace = true }
arc-swap = { workspace = true }
hound = { workspace = true }
audioadapter-buffers = { workspace = true }
log = { workspace = true }
realfft = { workspace = true }
rubato = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-binaural"
path = "bin/qa_binaural.rs"
required-features = ["qa"]

[dev-dependencies]
criterion = { workspace = true }
sofa-reader = { workspace = true }

[[bench]]
name = "binaural-decoder-benchmark"
harness = false
