[package]
name = "sotf-plugin-band-merge"
description = "SOTF Band Merge plugin - merge frequency bands"
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_band_merge"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-band-merge"
path = "bin/qa_band_merge.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
