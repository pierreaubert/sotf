[package]
name = "sotf-plugin-convolution"
description = "SOTF Convolution plugin - FFT-based convolution for IR processing"
version = "0.5.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_convolution"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-convolution"
path = "bin/qa_convolution.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
plugins-spatial = { workspace = true }
arc-swap = { workspace = true }
rustfft = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
log = { workspace = true }
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-codec-pcm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
