[package]
name = "sotf-plugin-hiss-reducer"
description = "SOTF hiss reducer plugin - stationary high-frequency noise reduction"
version = "0.5.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_hiss_reducer"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-hiss-reducer"
path = "bin/qa_hiss_reducer.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
sotf-plugin-denoiser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
