[package]
name = "sotf-plugin-fletcher-munson"
description = "SOTF Fletcher-Munson plugin - equal loudness contour correction"
version = "0.5.2"
edition.workspace = true

[lib]
name = "sotf_plugin_fletcher_munson"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-fletcher-munson"
path = "bin/qa_fletcher_munson.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
