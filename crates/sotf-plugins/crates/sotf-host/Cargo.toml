[package]
name = "sotf-host"
description = "Core traits, host, and shared utilities for SOTF audio plugins"
version = "0.5.89"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_host"
path = "src/lib.rs"

[features]
default = []
qa = ["dep:criterion"]

[dependencies]
gpui-design = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
clap = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
rand = { workspace = true }
rtrb = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
bincode = { workspace = true }
sofa-reader = { workspace = true }
rayon = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
criterion = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
