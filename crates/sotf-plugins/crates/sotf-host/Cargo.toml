[package]
name = "sotf-host"
description = "Core traits, host, and shared utilities for SOTF audio plugins"
version = "0.5.105"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_host"
path = "src/lib.rs"

[[bench]]
name = "multichannel_auto_gain_benchmark"
harness = false

[[bench]]
name = "parameter_id_benchmark"
harness = false

[[bin]]
name = "qa-host"
path = "bin/qa_host.rs"
required-features = ["qa"]

[[bin]]
name = "sotf-external-plugin-worker"
path = "bin/external_plugin_worker.rs"

[[bin]]
name = "sotf-macos-sandbox-helper"
path = "bin/macos_sandbox_helper.rs"

[features]
default = []
qa = ["dep:criterion"]
external-plugin-clap = ["dep:clap-sys", "dep:libloading"]
external-plugin-vst3 = ["dep:libloading", "dep:vst3-com", "dep:vst3-sys"]
external-plugin-au = [
    "dep:objc2-audio-toolbox",
    "dep:objc2-core-audio-types",
    "dep:objc2-core-foundation",
]

[dependencies]
gpui-builder = { workspace = true }
gpui-design = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
clap = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
rand = { workspace = true }
rtrb = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
sofa-reader = { workspace = true }
rayon = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
criterion = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156", optional = true }
vst3-sys = { git = "https://github.com/robbert-vdh/vst3-sys.git", branch = "fix/drop-box-from-raw", optional = true }
vst3-com = { git = "https://github.com/robbert-vdh/vst3-sys.git", branch = "fix/drop-box-from-raw", optional = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-audio-toolbox = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "AUComponent",
    "AudioComponent",
    "AudioUnitProperties",
    "MusicDevice",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }
objc2-core-audio-types = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CFBase",
    "CFData",
    "CFError",
    "CFPropertyList",
    "CFString",
] }
