[package]
name = "sotf-host"
description = "Core traits, host, and shared utilities for SOTF audio plugins"
version = "0.5.93"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_host"
path = "src/lib.rs"

[[bin]]
name = "qa-host"
path = "bin/qa_host.rs"
required-features = ["qa"]

[[bin]]
name = "sotf-external-plugin-worker"
path = "bin/external_plugin_worker.rs"

[[bin]]
name = "sotf-macos-sandbox-helper"
path = "bin/macos_sandbox_helper.rs"

[features]
default = []
qa = ["dep:criterion"]
external-plugin-clap = ["dep:libloading"]
external-plugin-vst3 = ["dep:libloading"]
external-plugin-au = ["dep:libloading"]

[dependencies]
gpui-design = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
clap = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
rand = { workspace = true }
rtrb = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
sofa-reader = { workspace = true }
rayon = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
criterion = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
