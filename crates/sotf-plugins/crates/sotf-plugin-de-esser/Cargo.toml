[package]
name = "sotf-plugin-de-esser"
description = "SOTF De-Esser plugin - sibilance reduction"
version = "0.5.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
name = "sotf_plugin_de_esser"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-de-esser"
path = "bin/qa_de_esser.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
