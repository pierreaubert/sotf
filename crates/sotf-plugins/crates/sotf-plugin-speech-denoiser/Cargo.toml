[package]
name = "sotf-plugin-speech-denoiser"
description = "SOTF speech denoiser plugin - RNNoise voice denoising"
version = "0.5.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugin_speech_denoiser"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-speech-denoiser"
path = "bin/qa_speech_denoiser.rs"
required-features = ["qa"]

[dependencies]
plugins-denoiser = { workspace = true }
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
