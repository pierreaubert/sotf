[package]
name = "sotf-plugin-delay"
description = "SOTF Delay plugin - audio delay with feedback"
version.workspace = true
edition.workspace = true

[lib]
name = "sotf_plugin_delay"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-delay"
path = "bin/qa_delay.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
