[package]
name = "plugins-gpui"
description = "Common GPUI rendering infrastructure for SOTF audio plugin UIs"
version = "0.5.4"
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# GPUI rendering
gpui = { workspace = true }
gpui-design = { workspace = true }
gpui-px = { workspace = true, features = ["gpui"] }
gpui-ui-kit = { workspace = true }
gpui-audio-kit = { workspace = true }

# Audio math (Biquad for EQ response curves, etc.)
math-iir-fir = { workspace = true }

# Plugin infrastructure (ParamSpec, PluginLayout)
sotf-host = { workspace = true }

# MIDI controller mapping overlay
sotf-midi = { workspace = true }
