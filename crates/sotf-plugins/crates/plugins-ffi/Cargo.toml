[package]
name = "plugins-ffi"
version = "0.5.3"
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "C FFI bindings for SOTF audio plugins (for Audio Unit integration)"
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
plugins-bridge = { path = "../plugins-bridge" }
sotf-host = { workspace = true }
sotf-plugins = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# GPUI AU rendering (linked into the same staticlib to avoid duplicate Rust runtime symbols)
gpui-au = { workspace = true }
gpui = { workspace = true }

# Plugin UI infrastructure
plugins-gpui = { path = "../plugins-gpui" }
sotf-plugin-eq = { workspace = true, features = ["gpui-ui"] }
math-iir-fir = { workspace = true }
gpui-ui-kit = { workspace = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { workspace = true }
