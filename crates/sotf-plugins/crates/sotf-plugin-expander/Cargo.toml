[package]
name = "sotf-plugin-expander"
description = "SOTF Expander plugin - dynamic range expansion"
version = "0.5.17"
edition.workspace = true

[lib]
name = "sotf_plugin_expander"
path = "src/lib.rs"

[features]
qa = ["sotf-host/qa"]

[[bin]]
name = "qa-expander"
path = "bin/qa_expander.rs"
required-features = ["qa"]

[dependencies]
sotf-host = { workspace = true }
math-dsp = { workspace = true }
serde = { workspace = true }
