[package]
name = "sotf-plugins"
description = "an audio player and recorder that support audio plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sotf_plugins"
path = "src/lib.rs"

[features]
default = ["iamf"]
iamf = []
onnx = ["dep:ort", "sotf-plugin-upmixer/onnx"]
hal = ["sotf-plugin-hal-input", "sotf-plugin-hal-input/hal", "sotf-plugin-hal-output", "sotf-plugin-hal-output/hal", "driver-hal"]
qa = ["sotf-host/qa", "dep:criterion"]

[dependencies]
sotf-host = { workspace = true }
sotf-plugin-ab-compare = { workspace = true }
sotf-plugin-aae = { workspace = true }
sotf-plugin-aec = { workspace = true }
sotf-plugin-ambisonics = { workspace = true }
sotf-plugin-band-merge = { workspace = true }
sotf-plugin-beamformer = { workspace = true }
sotf-plugin-band-split = { workspace = true }
sotf-plugin-binaural = { workspace = true }
sotf-plugin-channel-mute-solo = { workspace = true }
sotf-plugin-convolution = { workspace = true }
sotf-plugin-crossfeed = { workspace = true }
sotf-plugin-crossover = { workspace = true }
sotf-plugin-delay = { workspace = true }
sotf-plugin-de-esser = { workspace = true }
sotf-plugin-dynamic-eq = { workspace = true }
sotf-plugin-denoiser = { workspace = true }
sotf-plugin-speech-denoiser = { workspace = true }
sotf-plugin-hiss-reducer = { workspace = true }
sotf-plugin-declick = { workspace = true }
sotf-plugin-dither = { workspace = true }
sotf-plugin-downmix = { workspace = true }
sotf-plugin-eq = { workspace = true }
sotf-plugin-gain = { workspace = true }
sotf-plugin-gate = { workspace = true }
sotf-plugin-hal-input = { workspace = true, optional = true }
sotf-plugin-hal-output = { workspace = true, optional = true }
sotf-plugin-linear-phase-eq = { workspace = true }
sotf-plugin-limiter = { workspace = true }
sotf-plugin-loudness-compensation = { workspace = true }
sotf-plugin-matrix = { workspace = true }
sotf-plugin-mono-to-stereo = { workspace = true }
sotf-plugin-multiband-compressor = { workspace = true }
sotf-plugin-multiband-expander = { workspace = true }
sotf-plugin-pnd = { workspace = true }
sotf-plugin-resampler = { workspace = true }
sotf-plugin-saturation = { workspace = true }
sotf-plugin-spectral-compressor = { workspace = true }
sotf-plugin-stereo-imager = { workspace = true }
sotf-plugin-transient-shaper = { workspace = true }
sotf-plugin-upmixer = { workspace = true, default-features = false }
sotf-plugin-xtc = { workspace = true }
tokio = { workspace = true }
ndarray = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
arc-swap = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
criterion = { workspace = true, optional = true }

# Audio decoding/encoding
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-codec-alac = { workspace = true }
symphonia-codec-pcm = { workspace = true }
symphonia-codec-vorbis = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
rtrb = { workspace = true }
ort = { workspace = true, optional = true }
hound = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
id3 = { workspace = true }
metaflac = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
driver-hal = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
insta = { workspace = true }
serial_test = { workspace = true }
proptest = "1.5"
sofa-reader = { workspace = true }

[[bin]]
name = "plugin-fuzzer"
path = "bin/plugin_fuzzer.rs"

[[bench]]
name = "all-plugins-benchmark"
harness = false

[[bench]]
name = "allocation-benchmark"
harness = false
