[package]
name = "driver-hal"
version = "0.1.12"
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared memory interface for Swift HAL driver communication"

[lib]
name = "driver_hal"
crate-type = ["lib"]

[features]
default = []
# Enable per-call trace logs on the audio path. Disabled by default because
# the macro expansion (even gated by RUST_LOG) still constructs Arguments and
# is hostile to real-time audio threads.
audio-trace = []

[dependencies]
driver-common = { workspace = true }

# This crate is macOS-only (Core Audio HAL driver)
[target.'cfg(target_os = "macos")'.dependencies]
# Shared memory mapping
memmap2 = { workspace = true }
# For getting user ID
libc = { workspace = true }
# Encryption for secure audio data in shared memory
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
bytemuck = { workspace = true }
# Logging
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
sotf-plugins = { path = "../../../sotf-plugins", default-features = false }
serde_json = { workspace = true }
libc = { workspace = true }
proptest = { workspace = true }
