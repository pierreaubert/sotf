[package]
name = "sotf-player"
version = "0.5.120"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared business logic for SOTF audio players"
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable this feature to bypass security validation in tests (for integration tests)
testing = []
# Enable HAL audio input support (macOS only)
hal = ["sotf-engine/hal"]

[lib]
name = "sotf_audio_player"
path = "src/lib.rs"

[[bin]]
name = "sotf-bliss-scan"
path = "src/bin/bliss_scan.rs"

[dependencies]
math-iir-fir = { workspace = true }
math-optimisation = { workspace = true }
autoeq = { workspace = true }
sotf-plugins = { workspace = true }
sotf-engine = { workspace = true }
sotf-mpd = { workspace = true }
sotf-dlna = { workspace = true }
sotf-federation = { workspace = true }

# math
ndarray = { workspace = true }
num-complex = { workspace = true }

# common stuff
anyhow = { workspace = true }
md-5 = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

# Image processing for album art thumbnails
image = { workspace = true }

# Unicode normalization for removing diacritics
unicode-normalization = { workspace = true }

# audio
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }

# Audio feature analysis (pure Rust replacement for bliss-audio)
math-dsp = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
num_cpus = { workspace = true }

# CLI for bliss scanner
clap = { workspace = true }

# use vcpkg (gmsh, opencv4 ...)
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "84bab45"
dependencies = ["nlopt", "openblas"]

# [package.metadata.vcpkg.target]
# x86_64-apple-darwin = { dependencies = ["sdl2", "sdl2-gfx" ] }
# x86_64-unknown-linux-gnu = { dependencies = ["sdl2", "opencv"] }
# x86_64-pc-windows-msvc = { triplet = "x64-windows-static", dependencies = ["sdl2", "zeromq"] }

[dev-dependencies]
sotf-player = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
