[package]
name = "sotf-player"
version = "0.5.123"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared business logic for SOTF audio players"
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable this feature to bypass security validation in tests (for integration tests)
testing = []
# Enable HAL audio input support (macOS only)
hal = ["sotf-engine/hal"]

[lib]
name = "sotf_audio_player"
path = "src/lib.rs"

[[bin]]
name = "sotf-bliss-scan"
path = "src/bin/bliss_scan.rs"

[dependencies]
math-iir-fir = { workspace = true }
math-optimisation = { workspace = true }
autoeq = { workspace = true }
sotf-plugins = { workspace = true }
sotf-engine = { workspace = true }
sotf-mpd = { workspace = true, features = ["tls"] }
sotf-dlna = { workspace = true }
sotf-federation = { workspace = true }
sotf-tls = { workspace = true }
tokio-rustls = { workspace = true }

# math
ndarray = { workspace = true }
num-complex = { workspace = true }

# common stuff
anyhow = { workspace = true }
sha2 = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
crossbeam = { workspace = true }
rand = { workspace = true }
socket2 = { workspace = true }

# Image processing for album art thumbnails
image = { workspace = true }

# Unicode normalization for removing diacritics
unicode-normalization = { workspace = true }

# audio
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }

# Audio feature analysis (pure Rust replacement for bliss-audio)
math-dsp = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
num_cpus = { workspace = true }

# CLI for bliss scanner
clap = { workspace = true }

[dev-dependencies]
sotf-player = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
