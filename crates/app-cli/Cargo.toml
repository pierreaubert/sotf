[package]
name = "app-cli"
description = "an audio player and recorder that support audio plugins"
version = "0.5.22"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "player-cli"
path = "bin/sotf_player_cli.rs"

[[bin]]
name = "sotf-recorder-cli"
path = "bin/sotf_recorder_cli.rs"

[dependencies]
tokio = { workspace = true }
ndarray = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
# Vendor SQLite into shipping binaries (deterministic builds, no system dep).
# Library crates take the bare workspace dep; feature unification activates
# `bundled` only when this app is in the build graph.
rusqlite = { workspace = true, features = ["bundled"] }
walkdir = { workspace = true }
math-iir-fir = { workspace = true }
sotf-plugins = { workspace = true }
sotf-engine = { workspace = true }
sotf-player = { workspace = true }
num-complex = { workspace = true }

# Audio decoding/encoding
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-codec-alac = { workspace = true }
symphonia-codec-pcm = { workspace = true }
symphonia-codec-vorbis = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
id3 = { workspace = true }
rtrb = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
driver-hal = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
assert_cmd = "2.0"
predicates = "3.1"
sotf-engine = { workspace = true }
sotf-test = { workspace = true }
sotf-testkit = { workspace = true }
sotf-player = { workspace = true, features = ["testing"] }
