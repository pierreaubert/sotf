[package]
name = "sotf-ios"
version = "0.5.3"
edition = "2024"
publish = false
description = "iOS app shell for SOTF music player"

[lib]
name = "sotf_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
gpui = { workspace = true }
gpui-ios = { workspace = true }
gpui-ui-kit = { workspace = true }
sotf-gpui = { path = "../app-gpui" }
sotf-player = { workspace = true }
sotf-engine = { workspace = true, features = ["streaming"] }

log = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
rust-embed = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

# Apple-only logging (oslog wraps os/log.h, only available on Apple platforms)
[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "macos"))'.dependencies]
oslog = { workspace = true }
