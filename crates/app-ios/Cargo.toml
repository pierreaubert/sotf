[package]
name = "sotf-ios"
version = "0.7.15"
edition = "2024"
publish = false
description = "iOS app shell for SOTF music player"

[lib]
name = "sotf_ios"
crate-type = ["staticlib", "rlib"]

# The application implementation is compiled on iOS and tvOS.
[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
gpui-ios = { workspace = true }
gpui = { workspace = true }
sotf-engine = { workspace = true, features = ["streaming"] }
log = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
sotf-player = { workspace = true }
rust-embed = { workspace = true }
sotf-gpui = { path = "../app-gpui" }
oslog = { workspace = true }

# Host tests compile the iOS implementation as well.
[dev-dependencies]
gpui-ios = { workspace = true }
gpui = { workspace = true }
sotf-engine = { workspace = true, features = ["streaming"] }
log = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
sotf-player = { workspace = true }
rust-embed = { workspace = true }
sotf-gpui = { path = "../app-gpui" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
oslog = { workspace = true }

[lints]
workspace = true
