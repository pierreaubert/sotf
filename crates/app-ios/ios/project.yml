name: SotFPlayer
options:
  bundleIdPrefix: org.spinorama
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: 0.6.8
    CURRENT_PROJECT_VERSION: 0.6.8
    SWIFT_OBJC_BRIDGING_HEADER: SotFPlayer/BridgingHeader.h
    # Only build for arm64 (our Rust lib is arm64-only)
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  SotFPlayer:
    type: application
    platform: iOS
    sources:
      - SotFPlayer
    preBuildScripts:
      - name: Build Rust static library
        script: ./build-rust.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.spinorama.sotf
        INFOPLIST_FILE: SotFPlayer/Info.plist
        SWIFT_VERSION: "5.10"
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/rust"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        DEAD_CODE_STRIPPING: false
        OTHER_LDFLAGS:
          - "-L$(DERIVED_FILE_DIR)/rust"
          - "-force_load"
          - "$(DERIVED_FILE_DIR)/rust/libsotf_ios.a"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework CoreText"
          - "-framework CoreGraphics"
          - "-framework CoreFoundation"
          - "-framework UIKit"
          - "-framework Foundation"
          - "-framework AVFoundation"
          - "-framework MediaPlayer"
          - "-framework Security"
          - "-framework AudioToolbox"
          - "-lc++"
          - "-lsqlite3"
  SotFPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SotFPlayerTests
    dependencies:
      - target: SotFPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.spinorama.sotf.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
