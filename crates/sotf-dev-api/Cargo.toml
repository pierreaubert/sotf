[package]
name = "sotf-dev-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Shared bounded development protocol for SOTF application QA"
license.workspace = true
repository.workspace = true
keywords = ["testing", "development-tools"]
categories = ["development-tools::testing"]

[features]
default = []
server = []

[dependencies]
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Exercise canonical hashing with insertion-ordered JSON maps even when this
# crate is tested independently of workspace feature unification.
serde_json = { workspace = true, features = ["preserve_order"] }
