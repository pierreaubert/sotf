[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "/tmp/sotf-listening-cancel"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"
[[scenario]]
name = "listening-preparation-cancel"
path = "crates/sotf-dev-driver/scenarios/listening_preparation_cancel.scn"
timeout = "45s"

[[scenario]]
name = "listening-preparation-cancel-german-narrow"
path = "crates/sotf-dev-driver/scenarios/listening_preparation_cancel_narrow.scn"
timeout = "45s"
theme = "Light"
language = "German"
font_scale = 1.5
reduced_motion = true

[[scenario]]
name = "listening-preparation-keyboard-german-narrow"
path = "crates/sotf-dev-driver/scenarios/listening_preparation_keyboard.scn"
timeout = "45s"
theme = "Light"
language = "German"
font_scale = 1.5
reduced_motion = true
