[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "/tmp/sotf-headphone-discovery-responsive"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "600x1000"

[[scenario]]
name = "headphone-eq-stale-request-retry"
path = "crates/sotf-dev-driver/scenarios/headphone_eq_stale_retry_narrow.scn"
timeout = "45s"
language = "German"
font_scale = 1.5
theme = "Light"
tags = ["headphone", "fixture", "ui", "offline", "race", "retry"]
allowed_log_patterns = ["Headphone download failed: Fixture Two fixture failure"]

[scenario.headphone_discovery]
catalog = ["Fixture One", "Fixture Two"]

[[scenario.headphone_discovery.downloads]]
headphone = "Fixture One"
path = "fixture-headphone-one.csv"
points = [[20.0, -4.0], [1000.0, 0.0], [20000.0, -3.0]]
delay_ms = 1000

[[scenario.headphone_discovery.downloads]]
headphone = "Fixture Two"
path = "fixture-headphone-two.csv"
points = [[20.0, -2.0], [1000.0, 1.0], [20000.0, -4.0]]
failures = 1
failure_message = "Fixture Two fixture failure"
