[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "/tmp/sotf-loudness-empty"
readiness_timeout = "20s"
size = "600x1000"
[[scenario]]
name = "loudness-empty"
path = "crates/sotf-dev-driver/scenarios/loudness_empty_editor.scn"
