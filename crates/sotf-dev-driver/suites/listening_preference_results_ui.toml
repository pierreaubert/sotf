[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "/tmp/sotf-listening-preference-results"
readiness_timeout = "20s"
size = "600x1000"

[[scenario]]
name = "preference-results"
path = "crates/sotf-dev-driver/scenarios/listening_preference_results.scn"
timeout = "45s"

[[scenario]]
name = "preference-results-german"
path = "crates/sotf-dev-driver/scenarios/listening_preference_results.scn"
timeout = "45s"
language = "German"
theme = "Light"
font_scale = 1.5
reduced_motion = true
