[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "headphone-application-history"
path = "crates/sotf-dev-driver/scenarios/headphone_application_history.scn"
timeout = "90s"
tags = ["headphone", "fixture", "ui", "offline"]

[[scenario]]
name = "headphone-application-history-german-scale"
path = "crates/sotf-dev-driver/scenarios/headphone_application_history.scn"
timeout = "90s"
theme = "BlackAndWhite"
language = "German"
font_scale = 1.5
reduced_motion = true
tags = ["headphone", "fixture", "ui", "offline"]

[[scenario]]
name = "headphone-application-history-light-scale"
path = "crates/sotf-dev-driver/scenarios/headphone_application_history.scn"
timeout = "90s"
theme = "Light"
font_scale = 2.0
reduced_motion = true
tags = ["headphone", "fixture", "ui", "offline"]

[[scenario]]
name = "roomeq-review-export-apply"
path = "crates/sotf-dev-driver/scenarios/roomeq_review_export_apply.scn"
timeout = "180s"
tags = ["roomeq", "ui", "review", "export", "apply"]

[scenario.room_eq]
fixture_dir = "crates/sotf-dev-driver/testkit/roomeq/stereo_reference"
dist_path = "fixtures/roomeq/stereo_reference"
target = "NearField"
loss = "Flat"
processing = "Iir"
crossover = "Lr24"
start = false
ui_driven = true

[[scenario]]
name = "spinorama-application"
path = "crates/sotf-dev-driver/scenarios/spinorama_application.scn"
timeout = "150s"
tags = ["spinorama", "fixture", "ui", "offline"]

[scenario.spinorama_discovery]
catalog = ["Fixture Speaker", "Fixture Speaker Two"]

[[scenario.spinorama_discovery.speakers]]
speaker = "Fixture Speaker"

[[scenario.spinorama_discovery.speakers.versions]]
version = "fixture-v1"
measurements = ["CEA2034", "Estimated In-Room Response"]
response = [
  [20.0, 72.0], [31.5, 73.5], [50.0, 75.0], [80.0, 74.0],
  [125.0, 76.0], [200.0, 75.0], [315.0, 74.0], [500.0, 72.5],
  [800.0, 73.0], [1250.0, 75.5], [2000.0, 74.5], [3150.0, 71.5],
  [5000.0, 70.0], [8000.0, 68.5], [12500.0, 66.0], [20000.0, 62.0],
]

[[scenario.spinorama_discovery.speakers]]
speaker = "Fixture Speaker Two"

[[scenario.spinorama_discovery.speakers.versions]]
version = "fixture-v2"
measurements = ["CEA2034"]


[[scenario]]
name = "headphone-application-history-narrow"
viewport = "600x1000"
theme = "Light"
font_scale = 1.5
path = "crates/sotf-dev-driver/scenarios/headphone_application_history.scn"
timeout = "90s"
tags = ["headphone", "fixture", "ui", "offline"]


[[scenario]]
name = "spinorama-application-narrow"
viewport = "600x1000"
theme = "Light"
font_scale = 1.5
path = "crates/sotf-dev-driver/scenarios/spinorama_application.scn"
