[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "home-continue"
path = "crates/sotf-dev-driver/scenarios/home_continue.scn"
seed_demo_audio = true
timeout = "60s"
tags = ["home", "playback", "ui"]

[[scenario]]
name = "home-empty"
path = "crates/sotf-dev-driver/scenarios/home_empty.scn"
timeout = "30s"
tags = ["home", "library", "ui"]

[[scenario]]
name = "home-history"
path = "crates/sotf-dev-driver/scenarios/home_history.scn"
timeout = "30s"
tags = ["home", "history", "ui"]
