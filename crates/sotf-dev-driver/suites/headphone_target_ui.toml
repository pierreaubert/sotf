[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "headphone-target"
path = "crates/sotf-dev-driver/scenarios/headphone_target_selection.scn"
timeout = "60s"
tags = ["headphone", "fixture", "ui", "offline"]

[[scenario]]
name = "headphone-target-german-scale"
path = "crates/sotf-dev-driver/scenarios/headphone_target_selection.scn"
timeout = "60s"
theme = "BlackAndWhite"
language = "German"
font_scale = 1.5
reduced_motion = true
tags = ["headphone", "fixture", "ui", "offline"]

[[scenario]]
name = "headphone-target-light-scale"
path = "crates/sotf-dev-driver/scenarios/headphone_target_selection.scn"
timeout = "60s"
theme = "Light"
font_scale = 2.0
reduced_motion = true
tags = ["headphone", "fixture", "ui", "offline"]
