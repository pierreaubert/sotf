[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "wizard-localization"
path = "crates/sotf-dev-driver/scenarios/wizard_localization.scn"
timeout = "90s"
tags = ["wizard", "locale", "accessibility", "french", "german"]

[[scenario]]
name = "indirect-localization-french"
path = "crates/sotf-dev-driver/scenarios/indirect_localization_french.scn"
timeout = "90s"
tags = ["locale", "accessibility", "french", "indirect-copy"]
viewport = "1024x768"
theme = "Light"
language = "French"
font_scale = 1.5
reduced_motion = true

[scenario.room_eq]
fixture_dir = "crates/sotf-dev-driver/testkit/roomeq/stereo_reference"
dist_path = "fixtures/roomeq/stereo_reference"
target = "NearField"
loss = "Flat"
processing = "Iir"
crossover = "Lr24"
start = false
ui_driven = true

[[scenario]]
name = "pseudo-locale-surfaces"
path = "crates/sotf-dev-driver/scenarios/pseudo_locale_surfaces.scn"
timeout = "90s"
tags = ["locale", "accessibility", "pseudo", "responsive"]
seed_demo_audio = true
viewport = "900x720"
theme = "Light"
language = "Pseudo"
font_scale = 1.5
reduced_motion = true

[scenario.room_eq]
fixture_dir = "crates/sotf-dev-driver/testkit/roomeq/stereo_reference"
dist_path = "fixtures/roomeq/stereo_reference"
target = "NearField"
loss = "Flat"
processing = "Iir"
crossover = "Lr24"
start = false
ui_driven = true
