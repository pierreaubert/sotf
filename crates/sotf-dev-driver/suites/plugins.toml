# Per-plugin lifecycle scenario suite
# Generated by scripts/generate_plugin_scenarios.py
#
# Run against GPUI (default):
#   cargo run -p sotf-dev-driver -- run-suite crates/sotf-dev-driver/suites/plugins.toml -v
#
# Run against TUI by overriding the runner app_bin, e.g.:
#   app_bin = "target/debug/sotf-tui"

[runner]
app_bin = "target/debug/sotf-desktop"
app_args = []
readiness_timeout = "20s"

[[scenario]]
name = "plugin_aae"
path = "crates/sotf-dev-driver/scenarios/plugins/AAE.scn"
timeout = "30s"
tags = ["plugin"]

