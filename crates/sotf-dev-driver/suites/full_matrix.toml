# Full test matrix for all SOTF applications.
#
# This suite delegates to per-app suite files. Run the entire matrix with:
#   cargo run -p sotf-dev-driver -- run-suite crates/sotf-dev-driver/suites/full_matrix.toml -v
#
# Individual app suites can also be run standalone:
#   cargo run -p sotf-dev-driver -- run-suite crates/sotf-dev-driver/suites/smoke.toml -v
#   cargo run -p sotf-dev-driver -- run-suite crates/sotf-dev-driver/suites/tui.toml -v

[runner]
app_bin = "target/debug/sotf-desktop"
readiness_timeout = "20s"

# ── GPUI scenarios ──────────────────────────────────────────────────────────

[[scenario]]
name = "gpui-smoke"
path = "crates/sotf-dev-driver/scenarios/smoke.scn"
timeout = "30s"
tags = ["gpui"]

