[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "/tmp/sotf-spinorama-export-recovery"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "spinorama-export-recovery"
path = "crates/sotf-dev-driver/scenarios/spinorama_export_recovery.scn"
timeout = "45s"
tags = ["spinorama", "export", "fixture", "offline"]

[[scenario]]
name = "spinorama-export-recovery-german-scale"
path = "crates/sotf-dev-driver/scenarios/spinorama_export_recovery.scn"
timeout = "45s"
theme = "Light"
language = "German"
font_scale = 1.5
reduced_motion = true
tags = ["spinorama", "export", "fixture", "offline"]
