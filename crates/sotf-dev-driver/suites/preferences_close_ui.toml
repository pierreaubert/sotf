[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "preferences-audio-save-failure"
path = "crates/sotf-dev-driver/scenarios/preferences_audio_save_failure.scn"

[[scenario]]
name = "preferences-replaygain-draft"
path = "crates/sotf-dev-driver/scenarios/preferences_replaygain_draft.scn"

[[scenario]]
name = "preferences-feature-availability"
path = "crates/sotf-dev-driver/scenarios/preferences_feature_availability.scn"
timeout = "60s"

[[scenario]]
name = "preferences-feature-availability-light-scale"
path = "crates/sotf-dev-driver/scenarios/preferences_feature_availability.scn"
timeout = "60s"
theme = "Light"
font_scale = 2.0
reduced_motion = true

[[scenario]]
name = "preferences-metadata-search"
path = "crates/sotf-dev-driver/scenarios/preferences_metadata_search.scn"
timeout = "60s"

[[scenario]]
name = "preferences-metadata-search-light-scale"
path = "crates/sotf-dev-driver/scenarios/preferences_metadata_search.scn"
timeout = "60s"
theme = "Light"
font_scale = 2.0
reduced_motion = true

[[scenario]]
name = "preferences-metadata-release-regression"
path = "crates/sotf-dev-driver/scenarios/settings_metadata_release.scn"
timeout = "60s"

[[scenario]]
name = "preferences-theme-discovery-search"
path = "crates/sotf-dev-driver/scenarios/preferences_theme_discovery_search.scn"
timeout = "90s"

[[scenario]]
name = "preferences-theme-discovery-search-light-scale"
path = "crates/sotf-dev-driver/scenarios/preferences_theme_discovery_search.scn"
timeout = "90s"
theme = "Light"
font_scale = 2.0
reduced_motion = true

[[scenario]]
name = "preferences-accessibility-search"
path = "crates/sotf-dev-driver/scenarios/preferences_accessibility_search.scn"
timeout = "60s"
reduced_motion = true

[[scenario]]
name = "preferences-accessibility-search-light-scale"
path = "crates/sotf-dev-driver/scenarios/preferences_accessibility_search.scn"
timeout = "60s"
theme = "Light"
font_scale = 2.0
reduced_motion = true

[[scenario]]
name = "preferences-worker-search"
path = "crates/sotf-dev-driver/scenarios/preferences_worker_search.scn"
timeout = "60s"

[[scenario]]
name = "preferences-worker-search-light-scale"
path = "crates/sotf-dev-driver/scenarios/preferences_worker_search.scn"
timeout = "60s"
theme = "Light"
font_scale = 2.0
reduced_motion = true

[[scenario]]
name = "preferences-setting-search"
path = "crates/sotf-dev-driver/scenarios/preferences_setting_search.scn"
timeout = "60s"

[[scenario]]
name = "preferences-category-keyboard"
path = "crates/sotf-dev-driver/scenarios/preferences_category_keyboard.scn"
timeout = "60s"

[[scenario]]
name = "preferences-close"
path = "crates/sotf-dev-driver/scenarios/preferences_close.scn"
timeout = "60s"
