[runner]

app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "spectrum-localized-zoom"
path = "crates/sotf-dev-driver/scenarios/spectrum_localized.scn"
timeout = "60s"
theme = "Light"
language = "English"
font_scale = 1.5
reduced_motion = true

[[scenario]]

name = "spectrum-unavailable-and-controls"
path = "crates/sotf-dev-driver/scenarios/gpui_spectrum.scn"
timeout = "30s"
tags = ["spectrum", "ui", "accessibility", "responsive"]

[[scenario]]
name = "spectrum-light-zoom"
path = "crates/sotf-dev-driver/scenarios/gpui_spectrum.scn"
timeout = "30s"
tags = ["spectrum", "ui", "accessibility", "responsive"]
theme = "Light"
language = "English"
font_scale = 2.0
reduced_motion = true

[[scenario]]
name = "spectrum-high-contrast"
path = "crates/sotf-dev-driver/scenarios/gpui_spectrum.scn"
timeout = "30s"
tags = ["spectrum", "ui", "accessibility", "responsive"]
theme = "BlackAndWhite"
language = "English"
font_scale = 1.5
reduced_motion = true
