[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "flat-queue"
path = "crates/sotf-dev-driver/scenarios/flat_queue.scn"
seed_demo_audio = true
timeout = "60s"

[[scenario]]
name = "flat-queue-keyboard-light"
path = "crates/sotf-dev-driver/scenarios/flat_queue_keyboard.scn"
seed_demo_audio = true
timeout = "60s"
theme = "Light"
language = "English"
font_scale = 2.0
reduced_motion = true

[[scenario]]
name = "flat-queue-keyboard-german"
path = "crates/sotf-dev-driver/scenarios/flat_queue_keyboard.scn"
seed_demo_audio = true
timeout = "60s"
theme = "BlackAndWhite"
language = "German"
font_scale = 1.5
reduced_motion = true
