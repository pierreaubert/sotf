name = "listening-preparation-error-french"
path = "crates/sotf-dev-driver/scenarios/listening_preparation_error.scn"
timeout = "45s"
theme = "Light"
language = "French"
font_scale = 1.5
reduced_motion = true

[[scenario]]
name = "listening-preparation-error-spanish"
path = "crates/sotf-dev-driver/scenarios/listening_preparation_error.scn"
timeout = "45s"
theme = "Light"
language = "Spanish"
