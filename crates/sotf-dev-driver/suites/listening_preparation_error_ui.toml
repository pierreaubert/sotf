[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "/tmp/sotf-listening-preparation-error"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"
[[scenario]]
name = "listening-preparation-error-german"
path = "crates/sotf-dev-driver/scenarios/listening_preparation_error.scn"
timeout = "45s"
theme = "Light"
language = "German"
font_scale = 1.5
reduced_motion = true

