# Native acceptance queued behind the AutoEQ dependency integration.
[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "choice-activation"
path = "crates/sotf-dev-driver/scenarios/dither_keyboard_activation.scn"
timeout = "60s"

[[scenario]]
name = "choice-activation-narrow"
path = "crates/sotf-dev-driver/scenarios/dither_keyboard_activation.scn"
timeout = "60s"
viewport = "600x1000"
theme = "Light"
font_scale = 1.5

[[scenario]]
name = "mono-primary"
path = "crates/sotf-dev-driver/scenarios/plugins/MonoToStereo.scn"
