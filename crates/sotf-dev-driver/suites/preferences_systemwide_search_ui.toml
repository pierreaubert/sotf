[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "preferences-systemwide-search"
path = "crates/sotf-dev-driver/scenarios/preferences_systemwide_search.scn"
timeout = "60s"

[[scenario]]
name = "preferences-systemwide-search-german-scale"
path = "crates/sotf-dev-driver/scenarios/preferences_systemwide_search.scn"
timeout = "60s"
language = "German"
theme = "Light"
font_scale = 1.5
reduced_motion = true
