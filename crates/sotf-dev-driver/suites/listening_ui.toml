timeout = "45s"
tags = ["listening", "blind-ab", "level-match", "ui"]

[[scenario]]
name = "listening-abx-session"
path = "crates/sotf-dev-driver/scenarios/listening_abx_session.scn"
seed_demo_audio = true
timeout = "45s"
tags = ["listening", "abx", "persistence", "ui"]

[[scenario]]
name = "listening-media-verification"
path = "crates/sotf-dev-driver/scenarios/listening_media_verification.scn"
seed_demo_audio = true
timeout = "45s"
