[runner]

app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]

name = "listening-how-to-listen"
path = "crates/sotf-dev-driver/scenarios/listening_how_to_listen.scn"
timeout = "30s"
tags = ["listening", "ui", "accessibility", "persistence"]

[[scenario]]
name = "listening-eq-training"
path = "crates/sotf-dev-driver/scenarios/listening_eq_training.scn"
timeout = "30s"
tags = ["listening", "eq-training", "ui", "accessibility"]

[[scenario]]
name = "listening-blind-ab"
path = "crates/sotf-dev-driver/scenarios/listening_blind_ab.scn"
