[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "practice-configuration"
path = "crates/sotf-dev-driver/scenarios/practice_configuration.scn"
timeout = "60s"
tags = ["listening", "practice", "configuration", "offline"]

[[scenario]]
name = "practice-configuration-german-scale"
path = "crates/sotf-dev-driver/scenarios/practice_configuration.scn"
timeout = "60s"
language = "German"
theme = "Light"
font_scale = 1.5
reduced_motion = true
tags = ["listening", "practice", "configuration", "offline"]
