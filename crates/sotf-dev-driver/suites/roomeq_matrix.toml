[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "roomeq-d3v-nearfield-flat-iir-lr24"
path = "crates/sotf-dev-driver/scenarios/roomeq_d3v_wizard_matrix.scn"
timeout = "150s"
tags = ["roomeq", "autoeq", "fixtures", "nearfield", "flat", "iir", "lr24"]
[scenario.room_eq]
fixture_dir = "../autoeq/data_tests/roomeq/measured/2.0_d3v"
dist_path = "crates/autoeq/data_tests/roomeq/measured/2.0_d3v"
target = "NearField"
loss = "Flat"
processing = "Iir"
crossover = "Lr24"

