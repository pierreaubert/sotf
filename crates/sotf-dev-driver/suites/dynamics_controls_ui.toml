[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "limiter-primary"
path = "crates/sotf-dev-driver/scenarios/plugins/Limiter.scn"
timeout = "60s"

[[scenario]]
name = "limiter-primary-narrow"
path = "crates/sotf-dev-driver/scenarios/plugins/Limiter.scn"
timeout = "60s"
viewport = "600x1000"
theme = "Light"
font_scale = 1.5

[[scenario]]
name = "gate-compact"
path = "crates/sotf-dev-driver/scenarios/plugins/Gate.scn"
timeout = "60s"
viewport = "600x1000"
theme = "Light"
font_scale = 1.5

[[scenario]]
name = "compressor-compact"
path = "crates/sotf-dev-driver/scenarios/plugins/Compressor.scn"
timeout = "60s"
viewport = "600x1000"
theme = "Light"
font_scale = 1.5

[[scenario]]
name = "compressor-compact-german"
path = "crates/sotf-dev-driver/scenarios/compressor_localization.scn"
timeout = "60s"
viewport = "600x1000"
theme = "Light"
font_scale = 1.5
language = "German"
