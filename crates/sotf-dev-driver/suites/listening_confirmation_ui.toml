[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "listening-end-confirmation"
path = "crates/sotf-dev-driver/scenarios/listening_end_confirmation.scn"
seed_demo_audio = true
timeout = "45s"
tags = ["listening", "confirmation", "keyboard", "ui"]

[[scenario]]
name = "listening-end-confirmation-narrow"
theme = "Light"
font_scale = 1.5
path = "crates/sotf-dev-driver/scenarios/listening_end_confirmation_narrow.scn"
seed_demo_audio = true
timeout = "45s"
tags = ["listening", "confirmation", "keyboard", "narrow", "ui"]
