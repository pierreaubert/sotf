[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "headphone-export-history"
path = "crates/sotf-dev-driver/scenarios/headphone_export_history.scn"
timeout = "90s"
tags = ["headphone", "fixture", "ui", "offline"]

[[scenario]]
name = "headphone-export-history-german-scale"
path = "crates/sotf-dev-driver/scenarios/headphone_export_history.scn"
timeout = "90s"
theme = "BlackAndWhite"
language = "German"
font_scale = 1.5
reduced_motion = true
tags = ["headphone", "fixture", "ui", "offline"]

[[scenario]]
name = "headphone-export-history-light-scale"
path = "crates/sotf-dev-driver/scenarios/headphone_export_history.scn"
timeout = "90s"
theme = "Light"
font_scale = 2.0
reduced_motion = true
tags = ["headphone", "fixture", "ui", "offline"]
