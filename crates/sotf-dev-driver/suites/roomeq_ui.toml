[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "60s"
size = "1440x900"

[[scenario]]
name = "roomeq-wizard-ui-happy"
path = "crates/sotf-dev-driver/scenarios/roomeq_wizard_ui_happy.scn"
timeout = "180s"
tags = ["roomeq", "ui", "fixtures", "wizard"]
[scenario.room_eq]
fixture_dir = "crates/sotf-dev-driver/testkit/roomeq/stereo_reference"
dist_path = "fixtures/roomeq/stereo_reference"
target = "NearField"
loss = "Flat"
processing = "Iir"
crossover = "Lr24"
start = false
ui_driven = true

