[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"
[[scenario]]
name = "studio-categories"
path = "crates/sotf-dev-driver/scenarios/studio_categories.scn"
timeout = "60s"

[[scenario]]
name = "studio-light-scale"
path = "crates/sotf-dev-driver/scenarios/studio_categories_scale.scn"
timeout = "60s"
theme = "Light"
font_scale = 2.0
reduced_motion = true

[[scenario]]
name = "studio-german-scale"
path = "crates/sotf-dev-driver/scenarios/studio_categories_scale.scn"
timeout = "60s"
theme = "BlackAndWhite"
language = "German"
font_scale = 1.5
reduced_motion = true

[[scenario]]
name = "compact-navigation-keyboard"
path = "crates/sotf-dev-driver/scenarios/compact_navigation_keyboard.scn"
timeout = "60s"
