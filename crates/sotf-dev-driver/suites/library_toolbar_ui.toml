timeout = "60s"

[[scenario]]
name = "library-album-list"
path = "crates/sotf-dev-driver/scenarios/library_album_list.scn"
seed_demo_audio = true
timeout = "60s"

[[scenario]]
name = "library-toolbar"
path = "crates/sotf-dev-driver/scenarios/library_toolbar.scn"
seed_demo_audio = true
timeout = "60s"

[[scenario]]
name = "library-artists"
path = "crates/sotf-dev-driver/scenarios/library_artists.scn"
seed_demo_audio = true
timeout = "60s"

[[scenario]]
name = "library-tracks"
path = "crates/sotf-dev-driver/scenarios/library_tracks.scn"
seed_demo_audio = true
timeout = "60s"

[[scenario]]
name = "album-detail"
path = "crates/sotf-dev-driver/scenarios/album_detail.scn"
seed_demo_audio = true
timeout = "60s"

[[scenario]]
name = "library-grid-scale"
