[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "playback-dark-english"
path = "crates/sotf-dev-driver/scenarios/playback_performance_budget.scn"
seed_demo_audio = true
timeout = "30s"
tags = ["visual", "desktop", "dark", "english", "playback"]
theme = "Dark"
language = "English"
font_scale = 1.0
reduced_motion = true

[[scenario]]
name = "settings-light-french-150"
path = "crates/sotf-dev-driver/scenarios/indirect_localization_french.scn"
timeout = "90s"
tags = ["visual", "responsive", "light", "french", "font-150"]
viewport = "1024x768"
theme = "Light"
language = "French"
font_scale = 1.5
reduced_motion = true

[scenario.room_eq]
fixture_dir = "crates/sotf-dev-driver/testkit/roomeq/stereo_reference"
dist_path = "fixtures/roomeq/stereo_reference"
target = "NearField"
loss = "Flat"
processing = "Iir"
crossover = "Lr24"
start = false
ui_driven = true

[[scenario]]
name = "player-light-pseudo-compact-150"
path = "crates/sotf-dev-driver/scenarios/pseudo_locale_surfaces.scn"
timeout = "90s"
tags = ["visual", "responsive", "light", "pseudo", "font-150"]
seed_demo_audio = true
viewport = "900x720"
theme = "Light"
language = "Pseudo"
font_scale = 1.5
reduced_motion = true

[scenario.room_eq]
fixture_dir = "crates/sotf-dev-driver/testkit/roomeq/stereo_reference"
dist_path = "fixtures/roomeq/stereo_reference"
target = "NearField"
loss = "Flat"
processing = "Iir"
crossover = "Lr24"
start = false
ui_driven = true
