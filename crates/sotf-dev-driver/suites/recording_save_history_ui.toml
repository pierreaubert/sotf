[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "recording-save-history"
allowed_log_patterns = ["Failed to prepare recording directory: target directory already exists:"]
path = "crates/sotf-dev-driver/scenarios/recording_save_history.scn"
timeout = "90s"
tags = ["recording", "fixture", "save", "offline"]
[scenario.fake_recording]
channels = 2
points = 48

[[scenario]]
name = "recording-save-history-german-scale"
allowed_log_patterns = ["Failed to prepare recording directory: target directory already exists:"]
path = "crates/sotf-dev-driver/scenarios/recording_save_history.scn"
timeout = "90s"
language = "German"
theme = "Light"
font_scale = 1.5
reduced_motion = true
tags = ["recording", "fixture", "save", "offline"]
[scenario.fake_recording]
channels = 2
points = 48

[[scenario]]
name = "recording-save-history-narrow"
allowed_log_patterns = ["Failed to prepare recording directory: target directory already exists:"]
path = "crates/sotf-dev-driver/scenarios/recording_save_history.scn"
timeout = "90s"
tags = ["recording", "fixture", "save", "offline"]
viewport = "600x1000"
theme = "Light"
font_scale = 1.5

[scenario.fake_recording]
channels = 2
points = 48

