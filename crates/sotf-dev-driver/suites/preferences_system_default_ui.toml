[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "preferences-system-default"
path = "crates/sotf-dev-driver/scenarios/preferences_system_default.scn"
timeout = "45s"

[[scenario]]
name = "preferences-system-default-german-scale"
path = "crates/sotf-dev-driver/scenarios/preferences_system_default.scn"
timeout = "45s"
language = "German"
theme = "Light"
font_scale = 1.5
reduced_motion = true
