[runner]
app_bin = "target/debug/sotf-desktop"
artifacts_dir = "target/qa-gpui"
demo_audio_dir = "data_tests/audio"
readiness_timeout = "20s"
size = "1440x900"

[[scenario]]
name = "comparison-source"
path = "crates/sotf-dev-driver/scenarios/comparison_source.scn"
timeout = "90s"
# The invalid fixture is exactly 17 bytes; this third-party probe diagnostic is expected.
allowed_log_patterns = ["ERROR symphonia_core::formats::probe] probe reached EOF at 17 bytes"]
tags = ["listening", "comparison", "source", "offline"]

[[scenario]]
name = "comparison-source-german-scale"
path = "crates/sotf-dev-driver/scenarios/comparison_source.scn"
timeout = "90s"
language = "German"
theme = "Light"
font_scale = 1.5
reduced_motion = true
# The invalid fixture is exactly 17 bytes; this third-party probe diagnostic is expected.
allowed_log_patterns = ["ERROR symphonia_core::formats::probe] probe reached EOF at 17 bytes"]
tags = ["listening", "comparison", "source", "offline"]

