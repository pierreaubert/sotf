schema_version = 1
version = 1
target = "desktop-gpui"
fixture_profiles = ["default", "demo-audio"]

[[actions]]
id = "navigate-library"
family = "navigation"
weight = 160
timeout_ms = 5000
coverage = ["screen:library"]
[actions.payload]
type = "dev_action"
name = "SwitchToLibrary"
payload = {}

[[actions]]
id = "navigate-queue"
family = "navigation"
weight = 120
timeout_ms = 5000
coverage = ["screen:queue"]
[actions.payload]
type = "dev_action"
name = "SwitchToQueue"
payload = {}

[[actions]]
id = "toggle-playback"
family = "transport"
weight = 100
precondition_id = "player-ready"
timeout_ms = 5000
coverage = ["transport:toggle"]
[actions.precondition]
op = "exists"
path = "state.playback.is_playing"
[actions.payload]
type = "dev_action"
name = "PlayPause"
payload = {}

[[actions]]
id = "toggle-mute"
family = "transport"
weight = 80
timeout_ms = 5000
coverage = ["transport:mute"]
[actions.payload]
type = "dev_action"
name = "Mute"
payload = {}

[[actions]]
id = "keyboard-down"
family = "keyboard"
weight = 60
timeout_ms = 5000
[actions.payload]
type = "key"
keystroke = "down"

[[actions]]
id = "pointer-move-center"
family = "pointer"
weight = 30
timeout_ms = 5000
coverage = ["input:pointer"]
[actions.payload]
type = "coordinate"
[actions.payload.input]
kind = "pointer"
phase = "move"
x = 400.0
y = 300.0
button = 0
viewport_revision = 0

[[actions]]
id = "scroll-center"
family = "pointer"
weight = 30
timeout_ms = 5000
coverage = ["input:scroll"]
[actions.payload]
type = "coordinate"
[actions.payload.input]
kind = "scroll"
delta_x = 0.0
delta_y = 48.0
x = 400.0
y = 300.0
viewport_revision = 0

[[actions]]
id = "recover-library"
family = "recovery"
weight = 100
recovery = true
timeout_ms = 5000
[actions.payload]
type = "dev_action"
name = "SwitchToLibrary"
payload = {}

[[invariants]]
id = "screen-present"
terminal = false
[invariants.condition]
op = "exists"
path = "state.screen"

[[workflows]]
from = "library"
action = "navigate-queue"
to = "queue"

[[workflows]]
from = "queue"
action = "navigate-library"
to = "library"
