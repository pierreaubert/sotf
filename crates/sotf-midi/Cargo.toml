[package]
name = "sotf-midi"
version = "0.1.3"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MIDI device management and control for SOTF audio players"
license.workspace = true
repository.workspace = true

[lib]
name = "sotf_audio_player_midi"
path = "src/lib.rs"

[dependencies]
sotf-host = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }

# MIDI I/O (not available on tvOS — no CoreMIDI)
[target.'cfg(not(target_os = "tvos"))'.dependencies]
midir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
env_logger = { workspace = true }
sotf-plugin-multiband-compressor = { workspace = true }
