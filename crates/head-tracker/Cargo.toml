[package]
name = "sotf-head-tracker"
description = "Camera-based head tracking for spatial audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["macos-vision"]
macos-vision = []
onnx = ["dep:ort"]

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }

# Image processing (for RGB to JPEG conversion)
image = { workspace = true }

# Camera capture - nokhwa for non-macOS platforms
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { workspace = true, features = ["input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { workspace = true, features = ["input-msmf"] }

# macOS frameworks (Vision + AVFoundation for camera)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-vision = { workspace = true }
objc2-core-image = { workspace = true }
objc2-core-video = { workspace = true }
objc2-av-foundation = { workspace = true }
objc2-core-media = { workspace = true }
block2 = { workspace = true }
dispatch = { workspace = true }

# Optional ONNX support for cross-platform (future)
# Note: ort 2.0 is still in RC, using latest stable for now
[dependencies.ort]
workspace = true
optional = true

[dev-dependencies]
env_logger = { workspace = true }

[[example]]
name = "head_tracker_demo"
path = "examples/head_tracker_demo.rs"

[[example]]
name = "vision_test"
path = "examples/vision_test.rs"

[[example]]
name = "xtc_integration"
path = "examples/xtc_integration.rs"
