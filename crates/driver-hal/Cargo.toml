[package]
name = "driver-hal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared memory interface for Swift HAL driver communication"

[lib]
name = "driver_hal"
crate-type = ["lib"]

# This crate is macOS-only (Core Audio HAL driver)
[target.'cfg(target_os = "macos")'.dependencies]
# Shared memory mapping
memmap2 = "0.9"
# For getting user ID
libc = "0.2"
# Encryption for secure audio data in shared memory
chacha20poly1305 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# Logging
log = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
plugins = { path = "../plugins", default-features = false }
