[package]
name = "driver-hal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared memory interface for Swift HAL driver communication"

[lib]
name = "driver_hal"
crate-type = ["lib"]

# This crate is macOS-only (Core Audio HAL driver)
[target.'cfg(target_os = "macos")'.dependencies]
# Shared memory mapping
memmap2 = "0.9"
# For getting user ID
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
plugins = { path = "../plugins", default-features = false }
