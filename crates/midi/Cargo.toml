[package]
name = "player-midi"
version = "0.1.3"
authors.workspace = true
edition.workspace = true
description = "MIDI device management and control for SOTF audio players"
license.workspace = true
repository.workspace = true

[lib]
name = "sotf_audio_player_midi"
path = "src/lib.rs"

[dependencies]
# Plugin parameter specs
sotf-host = { workspace = true }

# MIDI I/O
midir = { workspace = true }

# Serialization for device configuration
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
log = { workspace = true }

# Async runtime for background MIDI handling
tokio = { workspace = true }

# Thread-safe data structures
parking_lot = { workspace = true }

# Configuration directory
dirs = { workspace = true }

# Date/time for timestamps (used in examples)
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
env_logger = { workspace = true }
