[package]
name = "plugins"
description = "an audio player and recorder that support audio plugins"
version.workspace = true
edition.workspace = true

[lib]
name = "sotf_plugins"
path = "src/lib.rs"

[features]
default = ["sofa_support"]
hal = ["driver-hal"]
sofa_support = ["dep:netcdf"]
qa = []

[dependencies]
tokio = { workspace = true }
ndarray = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
netcdf = { workspace = true, optional = true }
arc-swap = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true }
autoeq-env = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

# Audio decoding/encoding
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-codec-alac = { workspace = true }
symphonia-codec-pcm = { workspace = true }
symphonia-codec-vorbis = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
ebur128 = { workspace = true }
rtrb = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
id3 = { workspace = true }
metaflac = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
driver-hal = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
proptest = "1.5"

[[bin]]
name = "plugin-fuzzer"
path = "bin/plugin_fuzzer.rs"

[[bin]]
name = "qa-ab-compare"
path = "bin/qa_ab_compare.rs"
required-features = ["qa"]

[[bin]]
name = "qa-compressor"
path = "bin/qa_compressor.rs"
required-features = ["qa"]

[[bin]]
name = "qa-delay"
path = "bin/qa_delay.rs"
required-features = ["qa"]

[[bin]]
name = "qa-downmix"
path = "bin/qa_downmix.rs"
required-features = ["qa"]

[[bin]]
name = "qa-eq"
path = "bin/qa_eq.rs"
required-features = ["qa"]

[[bin]]
name = "qa-expander"
path = "bin/qa_expander.rs"
required-features = ["qa"]

[[bin]]
name = "qa-gain"
path = "bin/qa_gain.rs"
required-features = ["qa"]

[[bin]]
name = "qa-gate"
path = "bin/qa_gate.rs"
required-features = ["qa"]

[[bin]]
name = "qa-limiter"
path = "bin/qa_limiter.rs"
required-features = ["qa"]

[[bin]]
name = "qa-loudness-compensation"
path = "bin/qa_loudness_compensation.rs"
required-features = ["qa"]

[[bin]]
name = "qa-mono-to-stereo"
path = "bin/qa_mono_to_stereo.rs"
required-features = ["qa"]

[[bin]]
name = "qa-multiband-compressor"
path = "bin/qa_multiband_compressor.rs"
required-features = ["qa"]

[[bin]]
name = "qa-multiband-expander"
path = "bin/qa_multiband_expander.rs"
required-features = ["qa"]

[[bin]]
name = "qa-pnd"
path = "bin/qa_pnd.rs"
required-features = ["qa"]

[[bin]]
name = "qa-upmixer"
path = "bin/qa_upmixer.rs"
required-features = ["qa"]

[[bin]]
name = "qa-xtc"
path = "bin/qa_xtc.rs"
required-features = ["qa"]

[[bin]]
name = "simd-fuzzer"
path = "bin/simd_fuzzer.rs"

[[bench]]
name = "binaural-decoder-benchmark"
harness = false

[[bench]]
name = "loudness-benchmark"
harness = false

[[bench]]
name = "upmixer-benchmark"
harness = false

[[bench]]
name = "compressor-benchmark"
harness = false

[[bench]]
name = "all-plugins-benchmark"
harness = false

[[bench]]
name = "allocation-benchmark"
harness = false
