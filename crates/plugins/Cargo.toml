[package]
name = "plugins"
description = "an audio player and recorder that support audio plugins"
version.workspace = true
edition.workspace = true

[lib]
name = "sotf_plugins"
path = "src/lib.rs"

[features]
default = ["sofa_support"]
hal = ["driver-hal"]
sofa_support = ["dep:netcdf"]

[dependencies]
tokio = { workspace = true }
ndarray = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
netcdf = { workspace = true, optional = true }
arc-swap = { workspace = true }
rustfft = { workspace = true }
realfft = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true }
autoeq-env = { workspace = true }
math-dsp = { workspace = true }
math-iir-fir = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

# Audio decoding/encoding
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-codec-alac = { workspace = true }
symphonia-codec-pcm = { workspace = true }
symphonia-codec-vorbis = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
ebur128 = { workspace = true }
rtrb = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
id3 = { workspace = true }
metaflac = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
driver-hal = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { workspace = true }
proptest = "1.5"

[[bin]]
name = "plugin-fuzzer"
path = "bin/plugin_fuzzer.rs"

[[bench]]
name = "binaural-decoder-benchmark"
harness = false

[[bench]]
name = "loudness-benchmark"
harness = false

[[bench]]
name = "upmixer-benchmark"
harness = false

[[bench]]
name = "compressor-benchmark"
harness = false

[[bench]]
name = "all-plugins-benchmark"
harness = false

[[bench]]
name = "allocation-benchmark"
harness = false
