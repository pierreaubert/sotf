[package]
name = "sotf-gpui"
version.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "GPUI music player frontend for SOTF"
license.workspace = true
repository.workspace = true

[features]
default = ["gpu-2d", "gpu-3d"]
hal = ["sotf-engine/hal", "sotf-player/hal", "driver-hal"]
onnx = ["sotf-plugins/onnx"]
iamf = ["sotf-engine/iamf", "sotf-plugins/iamf"]
gpu-2d = ["gpui-px/gpu-2d"]
gpu-3d = ["gpui-px/gpu-3d"]
tidal = ["dep:sotf-services", "sotf-services/tidal"]
spotify = ["dep:sotf-services", "sotf-services/spotify"]

[dependencies]
# GPUI framework
gpui = { workspace = true }
gpui-builder = { workspace = true }
gpui-design = { workspace = true, features = ["gpui"] }
gpui-keybinding = { workspace = true }
gpui-ui-kit = { workspace = true }
gpui-px = { workspace = true, features = ["gpui"] }

# Force naga termcolor feature to fix WriteColor trait compilation error
naga = { version = "28", features = ["termcolor"] }

# Shared audio player library (provides business logic, database, plugins, etc.)
sotf-player = { workspace = true }
sotf-plugins = { workspace = true }
sotf-engine = { workspace = true }
sotf-midi = { workspace = true }
sotf-cast = { workspace = true }
sotf-federation = { workspace = true }
sotf-services = { workspace = true, optional = true }
# math libraries
math-iir-fir = { workspace = true }
autoeq = { workspace = true }
math-optimisation = { workspace = true }

# Synchronous mutex (faster than std::sync::Mutex)
parking_lot = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# File system and utilities
walkdir = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }

# Fuzzy string matching
strsim = { workspace = true }

# Audio
id3 = { workspace = true }
metaflac = { workspace = true }
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }

# Testing utilities
tempfile = { workspace = true }

# Logging (GPUI-specific)
log = { workspace = true }
env_logger = { workspace = true }

# Smol runtime (used by GPUI)
smol = { workspace = true }

# HTTP client
reqwest = { workspace = true }
urlencoding = { workspace = true }

# Array processing
ndarray = { workspace = true }
num-complex = { workspace = true }


# Asset embedding
rust-embed = { workspace = true }
anyhow = { workspace = true }

# Image processing
image = { workspace = true }

# Memory allocator
mimalloc = { workspace = true }

rustfft = { workspace = true }

# Not available on iOS/tvOS — those platforms use their own APIs or lack support.
[target.'cfg(not(any(target_os = "ios", target_os = "tvos")))'.dependencies]
souvlaki = { workspace = true }    # OS media controls (MPRIS / MediaPlayer)
rfd = { workspace = true }         # File dialogs (no backend on tvOS)

[target.'cfg(all(unix, not(any(target_os = "ios", target_os = "tvos"))))'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true }
driver-hal = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { workspace = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
gpui-ios = { workspace = true }

[lib]
name = "sotf_audio_player_gpui"
path = "lib.rs"
# Disable test building - the deeply nested GPUI macros in ui.rs cause
# a stack overflow in syn during test mode compilation (SIGBUS).
# Actual tests are in engine/tests/ for audio functionality.
test = false

[[bin]]
name = "SotF"
path = "main.rs"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-ui-kit = { workspace = true }
math-iir-fir = { workspace = true }
cpal = { workspace = true }
hound = { workspace = true }
sotf-engine = { workspace = true }
sotf-player = { workspace = true, features = ["testing"] }
proptest = "1.6"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[[test]]
name = "negative"
path = "tests/negative/mod.rs"

[[test]]
name = "proptest_tests"
path = "tests/proptest/mod.rs"

[[test]]
name = "component_tests"
path = "tests/component_tests.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle/mod.rs"

[[test]]
name = "event_integration"
path = "tests/event_integration/mod.rs"

[[test]]
name = "state_machine"
path = "tests/state_machine/mod.rs"

[[test]]
name = "types_tests"
path = "tests/types_tests.rs"

[[test]]
name = "config_tests"
path = "tests/config_tests.rs"

[[test]]
name = "migration_tests"
path = "tests/migration_tests.rs"

[[test]]
name = "debug_tests"
path = "tests/debug_tests.rs"

[[test]]
name = "playback_events_tests"
path = "tests/playback_events_tests.rs"

[[test]]
name = "eq_chart_tests"
path = "tests/eq_chart_tests.rs"
