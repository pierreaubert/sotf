[package]
name = "sotf-gpui"
version.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "GPUI music player frontend for SOTF"
license.workspace = true
repository.workspace = true

[features]
default = ["gpu-2d"]
shipping = ["gpu-2d", "gpu-3d", "iamf", "streaming", "hls", "mimalloc-allocator"]
full = ["shipping", "tidal", "spotify", "onnx"]
hal = ["sotf-engine/hal", "sotf-player/hal", "driver-hal"]
onnx = ["sotf-plugins/onnx"]
iamf = ["sotf-engine/iamf", "sotf-plugins/iamf"]
streaming = ["sotf-engine/streaming", "sotf-player/streaming"]
hls = ["streaming", "sotf-engine/hls", "sotf-player/hls"]
gpu-2d = ["gpui-px/gpu-2d", "gpui-d3rs/gpu-2d"]
gpu-3d = ["gpui-px/gpu-3d", "gpui-d3rs/gpu-3d"]
mimalloc-allocator = ["dep:mimalloc"]
tidal = ["dep:sotf-service-tidal", "sotf-player/tidal"]
spotify = ["dep:sotf-service-spotify", "sotf-player/spotify"]
# QA/debug-only HTTP API for scripted E2E testing. Compile errors in release builds
# and only starts at runtime when `sotf-desktop --qa <dir>` is used.
qa = []
dev-api = ["sotf-player/dev-api"]
# macOS-only off-screen Metal capture support for release visual review.
# Kept out of default/shipping builds; the binary below requires it explicitly.
visual-qa = [
    "gpui/test-support",
    "gpui_macos/test-support",
    "gpui_macos/runtime_shaders",
]

[dependencies]
# GPUI framework
gpui = { workspace = true }
gpui-builder = { workspace = true }
gpui-design = { workspace = true, features = ["gpui"] }
gpui-keybinding = { workspace = true }
gpui-audio-kit = { workspace = true }
gpui-ui-kit = { workspace = true }
gpui-themes = { workspace = true }
gpui-px = { workspace = true, features = ["gpui"] }
gpui-d3rs = { workspace = true, features = ["gpui"] }
glam = { workspace = true }

# Shared audio player library (provides business logic, database, plugins, etc.)
sotf-player = { workspace = true }
sotf-plugins = { workspace = true }
sotf-engine = { workspace = true }
sotf-midi = { workspace = true }
sotf-cast = { workspace = true }
sotf-tls = { workspace = true }
sotf-service-tidal = { workspace = true, optional = true }
sotf-service-spotify = { workspace = true, optional = true }
plugins-gpui = { workspace = true }
# math libraries
math-iir-fir = { workspace = true }
autoeq = { workspace = true }
math-optimisation = { workspace = true }

# Synchronous mutex (faster than std::sync::Mutex)
parking_lot = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# File system and utilities
walkdir = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }

# Fuzzy string matching
strsim = { workspace = true }

# Vendor SQLite into the shipping binary (deterministic builds, no system dep).
# Direct dep here is required so feature unification activates `bundled` for
# the rusqlite that sotf-player / sotf-engine depend on.
rusqlite = { workspace = true, features = ["bundled"] }

# Audio
id3 = { workspace = true }
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }

# Testing utilities
tempfile = { workspace = true }

# Logging (GPUI-specific)
log = { workspace = true }
env_logger = { workspace = true }

# Smol runtime (used by GPUI)
smol = { workspace = true }

# HTTP client
reqwest = { workspace = true }
urlencoding = { workspace = true }

# Array processing
ndarray = { workspace = true }
num-complex = { workspace = true }


# Asset embedding
rust-embed = { workspace = true, features = ["include-exclude"] }
anyhow = { workspace = true }

# Image processing
image = { workspace = true }

# Memory allocator
mimalloc = { workspace = true, optional = true }

rustfft = { workspace = true }

# Not available on iOS/tvOS — those platforms use their own APIs or lack support.
[target.'cfg(not(any(target_os = "ios", target_os = "tvos")))'.dependencies]
sotf-media-controls = { workspace = true }    # OS media controls (MPRIS / MediaPlayer)
rfd = { workspace = true }         # File dialogs (no backend on tvOS)
rqrr = { workspace = true }        # QR image decoding for remote server setup

[target.'cfg(all(unix, not(any(target_os = "ios", target_os = "tvos"))))'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true }
driver-hal = { workspace = true, optional = true }
core-foundation = { workspace = true }
core-foundation-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { workspace = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
gpui-ios = { workspace = true }

[lib]
name = "sotf_audio_player_gpui"
path = "lib.rs"
# Disable test building - the deeply nested GPUI macros in ui.rs cause
# a stack overflow in syn during test mode compilation (SIGBUS).
# Actual tests are in engine/tests/ for audio functionality.
test = false

[[bin]]
name = "sotf-desktop"
path = "main.rs"

[[bin]]
name = "plugin_visual_review"
path = "bin/plugin_visual_review.rs"
required-features = ["visual-qa"]

[dev-dependencies]
crossterm = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
gpui-ui-kit = { workspace = true }
math-iir-fir = { workspace = true }
cpal = { workspace = true }
hound = { workspace = true }
sotf-engine = { workspace = true }
sotf-player = { workspace = true, features = ["testing"] }
sotf-tui = { path = "../app-tui", default-features = false }
sotf-testkit = { workspace = true }
proptest = { workspace = true }
syn = { workspace = true, features = ["visit"] }

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[[test]]
name = "negative"
path = "tests/negative/mod.rs"

[[test]]
name = "proptest_tests"
path = "tests/proptest/mod.rs"

[[test]]
name = "component_tests"
path = "tests/component_tests.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle/mod.rs"

[[test]]
name = "event_integration"
path = "tests/event_integration/mod.rs"

[[test]]
name = "state_machine"
path = "tests/state_machine/mod.rs"

[[test]]
name = "types_tests"
path = "tests/types_tests.rs"

[[test]]
name = "config_tests"
path = "tests/config_tests.rs"

[[test]]
name = "migration_tests"
path = "tests/migration_tests.rs"

[[test]]
name = "debug_tests"
path = "tests/debug_tests.rs"

[[test]]
name = "playback_events_tests"
path = "tests/playback_events_tests.rs"

[[test]]
name = "eq_chart_tests"
path = "tests/eq_chart_tests.rs"
