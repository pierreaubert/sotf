[package]
name = "gpui-design"
version = "0.7.1"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
license = "MIT"
repository.workspace = true
description = "Platform-adaptive design system (Apple HIG, Material 3, Fluent, Neutral)"

[features]
