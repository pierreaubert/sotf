[package]
name = "gpui-au"
version = "0.6.3"
edition = "2024"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "macOS Audio Unit platform backend for GPUI — embeds GPUI rendering inside AUv3 ViewControllers"
license = "ISC"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
log = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12"
futures = "0.3"
raw-window-handle = "0.6"

# GPUI core
gpui = { workspace = true }

# wgpu renderer (Metal backend on macOS)
gpui_wgpu = { workspace = true }
wgpu = { workspace = true }

# Objective-C runtime
objc = { workspace = true }

# Apple frameworks
core-foundation = { workspace = true }
core-graphics = "0.24"
core-text = "=21.0.0"

# Text / font stack
pathfinder_geometry = "0.5"
smallvec = { version = "1.6", features = ["union", "const_new"] }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", package = "zed-font-kit", version = "0.14.1-zed" }

# UUID for display identification
uuid = { workspace = true, features = ["v5"] }

# Logging to stderr (visible in Console.app for AU extensions)
env_logger = "0.11"
