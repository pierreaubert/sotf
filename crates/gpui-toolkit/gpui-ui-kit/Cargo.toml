[package]
name = "gpui-ui-kit"
version = "0.6.19"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A reusable UI component library for GPUI applications"
license = "ISC"
repository.workspace = true

[dependencies]
# GPUI framework
gpui = { workspace = true }
gpui-design = { workspace = true, features = ["gpui"] }

# Serialization for Color type
serde = { workspace = true }
serde_json = { workspace = true }

# UUID for node/connection IDs
uuid = { workspace = true }

# QR code generation
qrcode = { workspace = true }

# Async timer for animated components
smol = { workspace = true }

# Proc macros for theme generation
gpui-ui-kit-macros = { workspace = true }

# Platform backends (gpui_macos, gpui_linux, gpui_windows, gpui-ios) are NOT
# declared here. They live only in zed-industries/zed's git tree (or, for
# gpui-ios, the local workspace) with no crates.io release, so depending on
# them would make this crate unpublishable. Application shells live in the
# sibling `gpui-miniapp` crate (publish = false).

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
rqrr = { workspace = true }
# Examples in `examples/` use the MiniApp shell, which lives in a workspace-
# only crate (it transitively pulls in non-publishable platform backends).
gpui-miniapp = { workspace = true }

[target.'cfg(not(any(target_os = "ios", target_os = "tvos")))'.dev-dependencies]
nokhwa = { workspace = true, features = ["input-native"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = { workspace = true }
objc = { workspace = true }

[lib]
name = "gpui_ui_kit"
path = "src/lib.rs"

