[package]
name = "gpui-ui-kit"
version = "0.6.13"
authors.workspace = true
edition.workspace = true
description = "A reusable UI component library for GPUI applications"
license = "ISC"
repository.workspace = true

[dependencies]
# GPUI framework
gpui = { workspace = true }

# Serialization for Color type
serde = { workspace = true }
serde_json = { workspace = true }

# UUID for node/connection IDs
uuid = { workspace = true }

# QR code generation
qrcode = { workspace = true }

# Async timer for animated components
smol = { workspace = true }

# Proc macros for theme generation
gpui-ui-kit-macros = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
gpui-ios = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
rqrr = { workspace = true }

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
nokhwa = { workspace = true, features = ["input-native"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block = { workspace = true }
objc = { workspace = true }

[lib]
name = "gpui_ui_kit"
path = "src/lib.rs"

