[package]
name = "gpui-md"
version = "0.6.0"
authors.workspace = true
edition.workspace = true
description = "Markdown editor with live preview for GPUI applications"
license.workspace = true
repository.workspace = true

[features]
default = []
pdf-export = ["dep:genpdf"]
google-docs = ["dep:reqwest"]

[dependencies]
# GPUI framework
gpui = { workspace = true }

# Toolkit
gpui-builder = { workspace = true }
gpui-design = { workspace = true, features = ["gpui"] }
gpui-keybinding = { workspace = true }
gpui-pretext = { workspace = true }
gpui-ui-kit = { workspace = true }

# Markdown
comrak = "0.36"
ropey = "1.6"

# Word (.docx) import/export
docx = "1.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# File dialogs
rfd = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
log = { workspace = true }

# PDF export (optional)
genpdf = { version = "0.2", optional = true }

# Google Docs (optional)
reqwest = { workspace = true, optional = true }

[lib]
name = "gpui_md"
path = "src/lib.rs"

[[bin]]
name = "gpui-md-editor"
path = "src/bin/gpui_md_editor.rs"
