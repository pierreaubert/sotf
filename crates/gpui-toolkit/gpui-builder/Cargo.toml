[package]
name = "gpui-builder"
version = "0.7.2"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
license = "MIT"
repository.workspace = true
description = "Generic constraint-based layout solver for GPUI applications"

[dependencies]
gpui-design = { workspace = true, optional = true }
gpui-pretext = { workspace = true }
serde = { workspace = true }
# GPUI deps are optional, enabled by the `gpui` feature for the showcase binary.
gpui = { workspace = true, optional = true }
gpui-ui-kit = { workspace = true, optional = true }
gpui-miniapp = { workspace = true, optional = true }

# Platform GPUI backends (gpui_macos, gpui_linux, gpui_windows) come in
# transitively via gpui-miniapp.

[features]
default = []
showcase = ["dep:gpui", "dep:gpui-ui-kit", "dep:gpui-miniapp", "dep:gpui-design", "gpui-design/gpui"]

[[bin]]
name = "layout-showcase"
path = "src/bin/layout_showcase.rs"
required-features = ["showcase"]

[dev-dependencies]
serde_json = { workspace = true }
