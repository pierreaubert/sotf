[package]
name = "gpui-python-runtime"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true
license = "ISC"
repository.workspace = true
description = "Retained scene specifications for the GPUI Python wrapper"
readme = "README.md"

[features]
default = []
gpui = [
    "dep:gpui",
    "dep:gpui-d3rs",
    "dep:glam",
    "gpui-d3rs/gpu-3d",
]
showcase = [
    "gpui",
    "dep:gpui-design",
    "dep:gpui-miniapp",
    "dep:gpui-px",
    "dep:gpui-ui-kit",
    "gpui-px/gpui",
]

[dependencies]
gpui = { workspace = true, optional = true }
gpui-d3rs = { version = "0.7", path = "../gpui-d3rs", default-features = false, optional = true }
gpui-design = { workspace = true, optional = true }
gpui-miniapp = { workspace = true, optional = true }
gpui-px = { workspace = true, default-features = false, optional = true }
gpui-ui-kit = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "gpui-python-showcase"
path = "bin/showcase.rs"
required-features = ["showcase"]
