[package]
name = "autoeq"
version = "0.4.29"
description = "Automatic equalization for speakers, headphones and rooms!"
edition = { workspace = true }
keywords.workspace = true
categories.workspace = true
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = { workspace = true }
build_html = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
num_cpus = { workspace = true }
num-complex = { workspace = true }
metaheuristics-nature = { workspace = true }
rustfft = { workspace = true }
hound = { workspace = true }
plotly = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.9"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
strsim = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
urlencoding = { workspace = true }

# AutoEQ crates
math-iir-fir = { workspace = true }
math-dsp = { workspace = true }
math-optimisation = { workspace = true }
math-rir = { workspace = true }

# Core numerical computing
ndarray = { workspace = true }

# Optional features
nlopt = { workspace = true, optional = true }
plotly_static = { version = "0.1", features = ["chromedriver", "webdriver_download"], optional = true }
rayon.workspace = true

[features]
default = ["nlopt"]
nlopt = ["dep:nlopt"]
plotly_static = ["dep:plotly_static"]

[target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(all(any(target_os = "ios", target_os="ios_sim"), target_arch = "aarch64"))'.dependencies]

[target.'cfg(all(target_os = "linux", target_arch="x86_64"))'.dependencies]

[target.'cfg(all(target_os = "linux", target_arch="aarch64"))'.dependencies]

[target.'cfg(all(target_os = "windows", target_arch="x86_64"))'.dependencies]

[target.'cfg(all(target_os = "windows", target_arch="aarch64"))'.dependencies]

[[bin]]
name = "autoeq"
path = "bin/autoeq/main.rs"

[[bin]]
name = "benchmark-autoeq-speaker"
path = "bin/autoeq_benchmark_speaker.rs"

[[bin]]
name = "autoeq-download-speakers"
path = "bin/autoeq_download_speaker.rs"

[[bin]]
name = "roomeq"
path = "bin/roomeq/main.rs"

[[bin]]
name = "roomeq-fuzzer"
path = "bin/roomeq_fuzzer.rs"

[[bin]]
name = "roomeq-qa-quality"
path = "bin/roomeq_qa_quality.rs"

[[bin]]
name = "roomeq-qa-coverage"
path = "bin/roomeq_qa_coverage.rs"

[[bin]]
name = "roomeq-qa-features"
path = "bin/roomeq_qa_features.rs"

[[bin]]
name = "roomeq-qa-synthetic"
path = "bin/roomeq_qa_synthetic.rs"

[[bin]]
name = "convert-recording"
path = "bin/convert_recording.rs"

[lib]
name = "autoeq"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.23"
assert_fs = "1.0"
