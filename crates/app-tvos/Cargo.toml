[package]
name = "sotf-tvos"
version = "0.5.4"
edition = "2024"
publish = false
description = "tvOS (Apple TV) app shell for SOTF music player"

[lib]
name = "sotf_tvos"
crate-type = ["staticlib", "rlib"]

# The application implementation is compiled on iOS and tvOS.
[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
log = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
gpui = { workspace = true }
gpui-ios = { workspace = true }
gpui-ui-kit = { workspace = true }
sotf-gpui = { path = "../app-gpui" }
sotf-player = { workspace = true }
sotf-engine = { workspace = true, features = ["streaming"] }
rust-embed = { workspace = true }
oslog = { workspace = true }

[lints]
workspace = true
