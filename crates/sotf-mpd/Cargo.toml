[package]
name = "sotf-mpd"
description = "MPD (Music Player Daemon) protocol server for SOTF"
version = "0.1.0"
edition.workspace = true

[dependencies]
log = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "macros", "sync"] }

[dev-dependencies]
env_logger = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
