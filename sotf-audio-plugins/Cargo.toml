[package]
name = "sotf-audio-plugins"
description = "an audio player and recorder that support audio plugins"
version = { workspace = true }
edition = { workspace = true }

[lib]
name = "sotf_plugins"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
ndarray = { workspace = true }
notify = { workspace = true }
netcdf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
which = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
rustfft = { workspace = true }
realfft = "3.5"
log = "0.4"
env_logger = "0.11"
directories = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
autoeq-env = { path = "../autoeq-env" }
autoeq-iir = { path = "../math-iir" }
rand = { workspace = true }
rayon = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
sotf_hal = { path = "../sotf-macos-hal" }

# Audio decoding/encoding
symphonia = { workspace = true, default-features = false }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-codec-alac = { workspace = true }
symphonia-codec-pcm = { workspace = true }
symphonia-codec-vorbis = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
ebur128 = { workspace = true }
hound = { workspace = true }
rubato = { workspace = true }
id3 = { workspace = true }
metaflac = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "plugin_fuzzer"
path = "bin/plugin_fuzzer.rs"

[[bench]]
name = "binaural_decoder_benchmark"
harness = false

[[bench]]
name = "upmixer_benchmark"
harness = false

[[bench]]
name = "compressor_benchmark"
harness = false



