[package]
name = "sotf-audio-plugins-ffi"
version = "0.2.1"
edition = { workspace = true }
authors = { workspace = true }
description = "C FFI bindings for SOTF audio plugins (for Audio Unit integration)"
license = { workspace = true }

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
sotf-audio-plugins = { workspace = true, default-features = false, features = ["no-hal"] }
sotf-audio-engine = { workspace = true, default-features = false, features = ["no-hal"] }
autoeq-iir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }
