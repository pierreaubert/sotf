[package]
name = "sotf-head-scanner"
version = { workspace = true }
authors = { workspace = true }
description = "3D head scanner using computer vision for HRTF optimization"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[features]
default = ["sofa", "bem"]
sofa = ["hdf5"]  # Enable SOFA file generation
bem = ["netcdf"]  # Enable BEM solver integration

[lib]
name = "head_scanner"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Core workspace dependencies (ndarray without BLAS to avoid system dependency issues)
ndarray = { workspace = true, features = ["rayon", "serde"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
rustfft = { workspace = true }
num-complex = { workspace = true }
chrono = { workspace = true }

# Internal dependencies
convexhull3d = { workspace = true, package = "math-convexhull3d" }

# Computer vision and image processing
# export DYLD_FALLBACK_LIBRARY_PATH=/Applications/Xcode.app/Contents/Framework
opencv = { workspace = true, default-features = false, features = [
    "videoio",
    "imgproc",
    "calib3d",
    "features2d",
    "highgui",
    "objdetect"
] }
image = { workspace = true }
imageproc = { workspace = true }

# 3D geometry and mesh processing
nalgebra = { workspace = true, features = ["serde-serialize"] }
nalgebra-sparse = { workspace = true }  # Sparse matrix support for bundle adjustment
parry3d = { workspace = true }  # Modern replacement for deprecated ncollide3d
bytemuck = { workspace = true }  # For efficient data conversion
byteorder = { workspace = true }  # For binary data serialization

# ML inference for vision models (ONNX Runtime)
ort = { workspace = true, default-features = false, features = ["download-binaries", "coreml"] }

# Point cloud and mesh algorithms
kiddo = { workspace = true }  # k-d tree for nearest neighbor search
delaunator = { workspace = true }  # Delaunay triangulation

# SOFA file generation (HDF5)
# Using hdf5 0.8 instead of workspace version to avoid conflicts with netcdf 0.11 (which uses hdf5-metno-sys 0.9)
# This is a known limitation - SOFA generation requires a different HDF5 version than the BEM solver
# hdf5 = { version = "0.8", optional = true }
hdf5 = { workspace = true, optional = true }

# BEM solver integration (NetCDF + FFT)
netcdf = { workspace = true, optional = true }  # NetCDF file parsing

# Async and parallelism
rayon = { workspace = true }
futures = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive", "cargo"] }
indicatif = { workspace = true }  # Progress bars and spinners

[dev-dependencies]
tempfile = { workspace = true }
approx = { workspace = true }

[[bin]]
name = "head-scanner-cli"
path = "bin/head_scanner_cli.rs"

[[bin]]
name = "test-sfm"
path = "bin/test_sfm.rs"

[[bench]]
name = "performance"
harness = false
