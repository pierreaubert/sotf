# cbindgen configuration for generating C headers

language = "C"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen */"
include_guard = "HEAD_SCANNER_FFI_H"
pragma_once = true
cpp_compat = true
style = "both"

[parse]
parse_deps = true
include = ["head_scanner"]

[export]
include = ["Scanner", "ScanGuidance", "Mesh"]
exclude = []

[enum]
rename_variants = "ScreamingSnakeCase"

[struct]
derive_eq = false
derive_neq = false

[fn]
rename_args = "ScreamingSnakeCase"
