[[example]]
name = "chord_demo"
path = "examples/chord_demo.rs"

[[example]]
name = "chromatic_demo"
path = "examples/chromatic_demo.rs"

[[bin]]
name = "d3rs-spinorama"
path = "bin/spinorama_demo/main.rs"
required-features = ["spinorama"]
