[package]
name = "gpui-px"
version.workspace = true
authors.workspace = true
edition.workspace = true
license = "ISC"
repository.workspace = true
description = "High-level Plotly Express-style charting API built on d3rs and GPUI"

[features]
default = ["gpui"]
gpui = ["dep:gpui", "dep:gpui-ui-kit"]

[dependencies]
d3rs = { workspace = true }
gpui = { workspace = true, optional = true }
gpui-ui-kit = { workspace = true, optional = true }
thiserror = { workspace = true }

[[example]]
name = "px-showcase"
path = "examples/showcase.rs"

[[example]]
name = "logscale_demo"
path = "examples/logscale_demo.rs"
required-features = ["gpui"]

[[example]]
name = "spinorama_demo"
path = "examples/spinorama_demo.rs"
required-features = ["gpui"]

[dev-dependencies]
autoeq = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
