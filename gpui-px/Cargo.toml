[package]
name = "gpui-px"
version = "0.1.16"
authors.workspace = true
edition.workspace = true
license = "ISC"
repository.workspace = true
description = "High-level Plotly Express-style charting API built on d3rs and GPUI"

[features]
default = ["gpui"]
gpui = ["dep:gpui", "dep:gpui-ui-kit"]

[dependencies]
d3rs = { version="0.1", path = "../gpui-d3rs", package = "gpui-d3rs", features = ["gpu-3d"] }
gpui = { workspace=true, optional = true }
gpui-ui-kit = { version = "0.1", path = "../gpui-ui-kit", optional = true }
thiserror.workspace = true

[[example]]
name = "px-showcase"
path = "examples/showcase.rs"

[[example]]
name = "logscale_demo"
path = "examples/logscale_demo.rs"
required-features = ["gpui"]
