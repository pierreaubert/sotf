[package]
name = "sotf-audio-player"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Shared business logic for SOTF audio players"
license.workspace = true
repository.workspace = true

[features]
default = []
# Enable this feature to bypass security validation in tests (for integration tests)
testing = []

[lib]
name = "sotf_audio_player"
path = "src/lib.rs"

[[bin]]
name = "sotf-bliss-scan"
path = "src/bin/bliss_scan.rs"

[dependencies]
# Audio engine
sotf-audio-plugins = { path = "../sotf-audio-plugins" }
sotf-audio-engine = { path = "../sotf-audio-engine" }
math-iir-fir = { workspace = true }
autoeq-cea2034 = { path = "../autoeq-cea2034" }
autoeq-roomsim = { path = "../autoeq-roomsim" }
autoeq = { path = "../autoeq" }
ndarray = { workspace = true }
ndarray-linalg = { workspace = true }
num-complex = { workspace = true }

# common stuff
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Image processing for album art thumbnails
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Unicode normalization for removing diacritics
unicode-normalization = "0.1"

# audio
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
ebur128 = { workspace = true }

# bliss audio analysis (no ffmpeg, we use our own Symphonia decoder)
bliss-audio = { workspace = true }
rubato = { workspace = true }
num_cpus = { workspace = true }

# CLI for bliss scanner
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

