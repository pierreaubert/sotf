[package]
name = "sotf-gpui"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "GPUI music player frontend for SOTF"
license.workspace = true
repository.workspace = true

[dependencies]
# GPUI framework
gpui = { git = "https://github.com/zed-industries/zed.git" }

# GPUI UI Kit
gpui-ui-kit = { path = "../../gpui-ui-kit" }

# GPUI Plotting (Plotly Express-style charts)
gpui-px = { path = "../../gpui-px" }
gpui-d3rs = { path = "../../gpui-d3rs" }

# Shared audio player library (provides business logic, database, plugins, etc.)
sotf-audio-player = { path = ".." }

# Audio engine
sotf-audio-plugins = { path = "../../sotf-audio-plugins" }
sotf-audio-engine = { path = "../../sotf-audio-engine" }
autoeq-iir = { path = "../../math-iir" }
autoeq = { path = "../../autoeq" }
autoeq-de = { path = "../../math-de" }

# Synchronous mutex (faster than std::sync::Mutex)
parking_lot = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# File system and utilities
walkdir = { workspace = true }
id3 = "1.16"
metaflac = "0.2"
rfd = "0.15"
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }

# Testing utilities
tempfile = { workspace = true }

# CLI
clap = { workspace = true }

# Logging (GPUI-specific)
log = { workspace = true }
env_logger = { workspace = true }

# Smol runtime (used by GPUI)
smol = { workspace = true }

# Array processing
ndarray = { workspace = true }

# Asset embedding
rust-embed = { workspace = true }
anyhow = { workspace = true }

[lib]
name = "sotf_audio_player_gpui"
path = "lib.rs"

[[bin]]
name = "sotf-gpui"
path = "main.rs"
