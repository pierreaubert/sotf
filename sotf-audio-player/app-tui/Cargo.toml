[package]
name = "sotf-tui"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "TUI music player frontend for SOTF"
license.workspace = true
repository.workspace = true

[dependencies]
# Shared audio player library (provides business logic, database, plugins, etc.)
sotf-audio-player = { path = ".." }

# Audio engine
sotf-audio-plugins = { path = "../../sotf-audio-plugins" }
sotf-audio-engine = { path = "../../sotf-audio-engine" }
math-iir-fir = { workspace = true }

# TUI framework
ratatui = { workspace = true }
ratatui-image = { version = "1.0", features = ["serde"] }
crossterm = { workspace = true }

# Synchronous mutex (faster than std::sync::Mutex)
parking_lot = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# File system and utilities
walkdir = { workspace = true }

# Audio metadata
symphonia = { workspace = true }
symphonia-core = { workspace = true }
symphonia-metadata = { workspace = true }
symphonia-bundle-flac = { workspace = true }
symphonia-bundle-mp3 = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-format-riff = { workspace = true }
symphonia-format-ogg = { workspace = true }
symphonia-format-isomp4 = { workspace = true }
ebur128 = { workspace = true }

# Image processing for album art thumbnails
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# CLI
clap = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Utilities
chrono = { workspace = true }
directories = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
name = "sotf_audio_player_tui"
path = "lib.rs"

[[bin]]
name = "sotf-tui"
path = "main.rs"
