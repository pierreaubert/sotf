[package]
name = "sotf-audio-player-midi"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "MIDI device management and control for SOTF audio players"
license.workspace = true
repository.workspace = true

[lib]
name = "sotf_audio_player_midi"
path = "src/lib.rs"

[dependencies]
# MIDI I/O
midir = "0.10"

# Serialization for device configuration
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
log = { workspace = true }

# Async runtime for background MIDI handling
tokio = { workspace = true }

# Thread-safe data structures
parking_lot = { workspace = true }

# Configuration directory
dirs = "5.0"

# Date/time for timestamps (used in examples)
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
env_logger = { workspace = true }
