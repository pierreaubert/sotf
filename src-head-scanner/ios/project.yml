# XcodeGen project specification
# Generate Xcode project with: xcodegen generate

name: HeadScanner
options:
  bundleIdPrefix: org.spinorama
  deploymentTarget:
    iOS: "15.0"

targets:
  HeadScanner:
    type: application
    platform: iOS
    deploymentTarget: "15.0"

    sources:
      - path: HeadScanner/Sources
        name: Sources
        type: group
      - path: HeadScanner/Resources
        name: Resources
        type: group
        optional: true

    settings:
      base:
        PRODUCT_NAME: HeadScanner
        PRODUCT_BUNDLE_IDENTIFIER: org.spinorama.headscanner
        INFOPLIST_FILE: HeadScanner/Config/Info.plist
        SWIFT_VERSION: "5.9"
        ENABLE_BITCODE: NO
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/HeadScanner/Frameworks
        SWIFT_OBJC_BRIDGING_HEADER: HeadScanner/Sources/Bridge/HeadScanner-Bridging-Header.h
        OTHER_LDFLAGS:
          - -lhead_scanner_device
          - -lc++
        CODE_SIGN_STYLE: Automatic

    scheme:
      testTargets: []
      gatherCoverageData: false

    dependencies: []

    attributes:
      DevelopmentTeam: ""  # Set your team ID here
