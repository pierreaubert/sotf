[package]
name = "head-scanner"
version = { workspace = true }
authors = { workspace = true }
description = "3D head scanner using computer vision for HRTF optimization"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "head_scanner"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Core workspace dependencies (ndarray without BLAS to avoid system dependency issues)
ndarray = { version = "0.16.1", features = ["rayon", "serde"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = "1.0"
parking_lot = { workspace = true }
chrono = { workspace = true }
rustfft = { workspace = true }
num-complex = { workspace = true }

# Internal dependencies
convexhull3d = { path = "../src-convexhull3d" }

# Computer vision and image processing
# export DYLD_FALLBACK_LIBRARY_PATH=/Applications/Xcode.app/Contents/Framework
opencv = { version = "0.97", default-features = false, features = [
    "videoio",
    "imgproc",
    "calib3d",
    "features2d",
    "highgui",
    "objdetect"
] }
image = "0.25"
imageproc = "0.25"

# 3D geometry and mesh processing
nalgebra = { version = "0.33", features = ["serde-serialize"] }
nalgebra-sparse = "0.10"  # Sparse matrix support for bundle adjustment
parry3d = "0.17"  # Modern replacement for deprecated ncollide3d
bytemuck = "1.24"  # For efficient data conversion
byteorder = "1.5"  # For binary data serialization

# ML inference for vision models (ONNX Runtime)
ort = { version = "2.0.0-rc.10", default-features = false, features = ["download-binaries", "coreml"] }

# Point cloud and mesh algorithms
kiddo = "4.2"  # k-d tree for nearest neighbor search
delaunator = "1.0"  # Delaunay triangulation

# Async and parallelism
rayon = { workspace = true }
futures = { workspace = true }

# Logging
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
indicatif = "0.17"  # Progress bars and spinners

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "head-scanner-cli"
path = "bin/head_scanner_cli.rs"

[[bin]]
name = "test-sfm"
path = "bin/test_sfm.rs"

[[bench]]
name = "performance"
harness = false
