[package]
name = "gpui-android"
version = "0.8.1"
edition = "2024"
repository = "https://github.com/pierreaubert/gpui-toolkit"
keywords = ["gpui", "ui", "android"]
categories = ["gui"]
description = "Android platform backend for GPUI"
license = "ISC"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
autoeq = []
camera = []
deeplink = []
gpu-2d = []
gpu-3d = []
media_session = []
reqwest = []
showcase = []
spinorama = []
tokio = []
urlencoding = []

[dependencies]
anyhow = "1.0"
futures = "0.3"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0" }
gpui_wgpu = { version = "0.1.0", git = "https://github.com/zed-industries/zed.git", tag = "v1.9.0" }
log = { version = "0.4.28", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
libc = "0.2"
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
rustc-hash = "2"
uuid = { version = "1", features = ["v5"] }
