[package]
name = "math-bem-wasm"
version = "0.1.2"
edition = "2021"
authors = { workspace = true }
description = "Room acoustic simulator"
license = { workspace = true }
repository = { workspace = true }
keywords = ["bem", "boundary-element", "acoustics", "numerical", "room acoustics"]
categories = ["science", "mathematics", "simulation", "hifi"]


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
ndarray = "0.17"

# Note: We don't depend on math-bem because it pulls in BLAS/LAPACK
# which don't compile to WASM. Instead we implement the necessary
# room acoustics types locally.

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"  # Optimize for size
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
